# CI проекта. Появился 14.08.2026 — до этого автоматических проверок не было
# вообще, при том что price-insight/Dockerfile прямо ссылался на «тесты гоняет
# CI». Теперь это правда.
#
# Что здесь НЕ делается сознательно: деплой. Он ручной, с сервера, двумя
# compose-файлами и под guard-clean-shell (см. Makefile и README-deploy.md).
# Автодеплой из CI потребовал бы держать в GitLab прод-секреты и SSH-ключ —
# после инцидента 2026-07-03 это лишняя поверхность ради сомнительного удобства.

stages:
  - test

variables:
  GIT_DEPTH: "20"

# ── Go: сборка, vet, тесты с детектором гонок ────────────────────────────────
go:test:
  stage: test
  image: golang:1.26
  cache:
    key: go-mod
    paths:
      - .gocache/
  variables:
    GOPATH: "$CI_PROJECT_DIR/.gocache/gopath"
    GOCACHE: "$CI_PROJECT_DIR/.gocache/build"
  script:
    - go build ./...
    - go vet ./...
    # -race обязателен: конкурентный консьюмер Kafka и параллельный скрейп WB —
    # ровно те места, где гонка не проявится на глаз. Именно -race поймал
    # непотокобезопасный тестовый дубль в internal/scraper.
    - go test -race -count=1 ./...

# ── Go: линтер ───────────────────────────────────────────────────────────────
# allow_failure ВРЕМЕННО: конфиг .golangci.yml включает wrapcheck и revive
# (exported), а код писался до линтера — накопленные замечания надо разгребать
# отдельно, а не блокировать ими каждый пуш. Снять флаг, когда список пуст.
go:lint:
  stage: test
  image: golangci/golangci-lint:latest
  allow_failure: true
  script:
    - golangci-lint run --timeout 5m ./...

# ── price-insight (JVM) ──────────────────────────────────────────────────────
# Без Docker-in-Docker: IntegrationTest помечен
# @Testcontainers(disabledWithoutDocker = true) и здесь просто пропускается.
# Юнит-тесты домена и прогон топологии на TopologyTestDriver брокера не требуют
# и гоняются полностью.
java:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: maven
    paths:
      - .m2/repository/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  script:
    - cd price-insight
    - mvn -B verify
  rules:
    # Не гонять на каждый пуш в промо/доки — Java-часть от них не зависит.
    - changes:
        - price-insight/**/*
        - .gitlab-ci.yml
