<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#140310">
<title>TryBerry</title>
<link rel="preconnect" href="/fonts/fonts.css">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{
    --ink:#170711; --plum:#260a1d; --bg:#140310;
    --berry:#e8336c; --berry-bright:#ff5d8f; --berry-deep:#a01651;
    --good:#3ad29f; --muted:#9a7d8c;
    --font-display:"Unbounded",system-ui,sans-serif;
    --font-body:"Onest",system-ui,-apple-system,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{font-size:clamp(15px,4.3vw,22px);-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font-body);color:#fff;background:var(--bg);
    /* фон-обои проступают за прозрачными зонами шапки/ввода */
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(160,22,81,.35), transparent 60%),
      linear-gradient(180deg,#1d0815,#120510 60%,#0e0409);
    min-height:100svh;
    /* страница чуть выше экрана → можно проскроллить и спрятать панель Safari */
    -webkit-font-smoothing:antialiased;
  }
  /* экран = ровно вьюпорт; .tail ниже → страница проскролливается, панель Safari прячется */
  .screen{min-height:100svh;display:flex;flex-direction:column}

  /* ── ШАПКА ЧАТА (sticky — остаётся при скролле) ── */
  .head{
    position:sticky;top:0;z-index:10;
    padding:calc(env(safe-area-inset-top) + .5rem) .9rem .6rem;
    display:flex;align-items:center;gap:.6rem;
    background:linear-gradient(180deg,rgba(30,10,24,.96),rgba(26,8,20,.86));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  .head .back{color:var(--berry-bright);font-size:1.5rem;line-height:1;flex:none;opacity:.9}
  .head .ava{width:2.1rem;height:2.1rem;border-radius:50%;background:#2a0e22;flex:none;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .head .ava img{width:78%;height:78%;object-fit:contain}
  .head .who{flex:1;min-width:0}
  .head .nm{font-weight:600;font-size:.98rem;display:flex;align-items:center;gap:.3rem}
  .head .nm .tick{color:var(--berry-bright);font-size:.8rem}
  .head .st{font-size:.72rem;color:var(--good);margin-top:.05rem}
  .head .dots{color:var(--muted);font-size:1.3rem;letter-spacing:.05em;flex:none;opacity:.7}

  /* ── ЛЕНТА СООБЩЕНИЙ ── */
  .thread{flex:1;display:flex;flex-direction:column;gap:.7rem;padding:1rem .8rem 1.2rem}
  .daysep{align-self:center;font-size:.68rem;color:#d9c2cf;background:rgba(255,255,255,.06);
    padding:.2rem .7rem;border-radius:99px;margin-bottom:.2rem}

  .typing{align-self:flex-start;display:flex;align-items:center;gap:.35rem;
    background:#26102a;border:1px solid rgba(255,93,143,.14);
    border-radius:1.1rem 1.1rem 1.1rem .3rem;padding:.7rem .85rem;
    opacity:0;transform:translateY(.6rem) scale(.96)}
  .typing i{width:.42rem;height:.42rem;border-radius:50%;background:var(--berry-bright);opacity:.5}
  .play .typing i{animation:blink 1s infinite}
  .play .typing i:nth-child(2){animation-delay:.15s}
  .play .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-.15rem)}}

  .msg{align-self:flex-start;max-width:86%;background:#26102a;
    border:1px solid rgba(255,93,143,.16);border-radius:1.15rem 1.15rem 1.15rem .3rem;
    padding:.85rem .95rem .55rem;position:relative;
    opacity:0;transform:translateY(.9rem) scale(.98)}
  .msg.alt{background:#1f0c2a}
  .msg .ttl{font-size:.86rem;color:var(--berry-bright);font-weight:600;display:flex;align-items:center;gap:.35rem;margin-bottom:.4rem}
  .msg .prod{font-size:.9rem;color:#f0dde7;line-height:1.35;margin-bottom:.55rem}
  .price{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
  .price .old{font-size:.85rem;color:var(--muted);text-decoration:line-through}
  .price .new{font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:#fff;white-space:nowrap}
  .price .badge{font-size:.74rem;font-weight:700;color:#fff;
    background:linear-gradient(120deg,var(--berry),var(--berry-deep));padding:.15rem .5rem;border-radius:.45rem}
  .verdict{font-size:.76rem;color:var(--good);font-weight:600;display:flex;align-items:center;gap:.3rem}
  .msg .meta{font-size:.74rem;color:var(--muted);line-height:1.35}
  .msg time{display:block;text-align:right;font-size:.66rem;color:var(--muted);margin-top:.35rem;opacity:.85}

  /* появление сообщений после «печатает» */
  .play .m1{animation:pop .55s var(--ease) 1.3s both}
  .play .t1{animation:tin .3s var(--ease) .35s both, tout .25s ease 1.25s forwards}
  .play .t2{animation:tin .3s var(--ease) 2.3s both, tout .25s ease 3.35s forwards}
  .play .m2{animation:pop .55s var(--ease) 3.45s both}
  @keyframes pop{to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes tin{to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes tout{to{opacity:0;transform:translateY(-.3rem) scale(.9);visibility:hidden}}

  /* ── СТРОКА ВВОДА + «хвост» для скролла (перекрытие панели Safari) ── */
  .composer{padding:.55rem .8rem calc(env(safe-area-inset-bottom) + .55rem);
    display:flex;align-items:center;gap:.55rem;
    background:linear-gradient(180deg,rgba(20,4,14,.4),#100309);
    border-top:1px solid rgba(255,255,255,.06)}
  .composer .plus{color:var(--berry-bright);font-size:1.5rem;flex:none;opacity:.85}
  .composer .field{flex:1;background:#241021;border:1px solid rgba(255,255,255,.08);
    border-radius:99px;padding:.55rem .9rem;color:var(--muted);font-size:.9rem}
  .composer .send{width:2.1rem;height:2.1rem;border-radius:50%;flex:none;
    background:linear-gradient(135deg,var(--berry),var(--berry-deep));
    display:flex;align-items:center;justify-content:center}
  .composer .send svg{width:1.1rem;height:1.1rem}
  /* хвост: сплошной фон бренда снизу — чистый фрагмент, чтобы перекрыть хром браузера */
  .tail{height:24svh;background:#0e0409;flex:none}

  @media(prefers-reduced-motion:reduce){
    .typing{display:none}
    .msg{opacity:1;transform:none;animation:none}
  }
</style>
</head>
<body>
  <div id="stage">
   <section class="screen">
    <header class="head">
      <span class="back">‹</span>
      <span class="ava"><img src="/logo.png" alt=""></span>
      <span class="who">
        <span class="nm">TryBerry <span class="tick">✓</span></span>
        <span class="st">bot · онлайн</span>
      </span>
      <span class="dots">⋯</span>
    </header>

    <main class="thread">
      <div class="daysep">сегодня</div>

      <div class="typing t1"><i></i><i></i><i></i></div>

      <div class="msg m1">
        <div class="ttl">📉 Цена реально снизилась</div>
        <div class="prod">Наушники беспроводные TWS, чёрные</div>
        <div class="price">
          <span class="old">2 490 ₽</span>
          <span class="new">1 690 ₽</span>
          <span class="badge">−32%</span>
        </div>
        <div class="verdict">✓ Честная скидка — не накрутка</div>
        <time>14:32</time>
      </div>

      <div class="typing t2"><i></i><i></i><i></i></div>

      <div class="msg m2 alt">
        <div class="ttl">🔎 В вашей выдаче</div>
        <div class="prod">«кроссовки мужские» — 3 товара реально подешевели</div>
        <div class="meta">Слежу за всей страницей результатов, а не за одним товаром</div>
        <time>14:33</time>
      </div>
    </main>

    <div class="composer">
      <span class="plus">＋</span>
      <span class="field">Сообщение</span>
      <span class="send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></span>
    </div>
   </section>
   <div class="tail"></div>
  </div>

<script>
  var stage = document.getElementById('stage');
  function pad(n){return (n<10?'0':'')+n;}
  function play(){
    var now = new Date();
    var t = pad(now.getHours())+':'+pad(now.getMinutes());
    // время уведомлений = реальное на момент открытия (совпадает со статус-баром)
    var times = stage.querySelectorAll('.msg time');
    times[0].textContent = t;
    if (times[1]) times[1].textContent = t;
    // перезапуск анимаций
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.add('play');
  }
  // играем при загрузке и КАЖДЫЙ раз, когда вкладка становится видимой
  // (ровно когда после разблокировки Safari выходит на передний план)
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) play(); });
  window.addEventListener('pageshow', play);
  play();
</script>
</body>
</html>
