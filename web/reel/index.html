<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TryBerry — reel studio</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preload" href="/fonts/onest-400-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/unbounded-700-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* ══ /reel — «студия» для записи универсального ролика (Reels/TikTok/сайт) ══
   Копия hero-композита из index.html (телефон + разворот + живой экран) на
   чистом 9:16-фоне: без даты (живая, всегда сегодня), без статус-баров, без
   обрезанных полос. Запись: окно/эмуляция 1080×1920 → скринкаст → готово.
   Клик в любом месте = перезапуск сцены (дубль). При правках hero в
   index.html — синхронизировать вручную. */
:root{
  --ink:#170711;--plum-deep:#260a1d;--cream:#f9f3ef;
  --berry:#e8336c;--berry-bright:#ff5d8f;--berry-deep:#a01651;
  --muted:#9a7d8c;--good:#3ad29f;--warn:#ffb23e;
  --font-display:'Unbounded',sans-serif;--font-body:'Onest',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-body);color:var(--cream);overflow:hidden;
  background:
    radial-gradient(90% 55% at 20% 8%, rgba(232,51,108,.16), transparent 60%),
    radial-gradient(80% 60% at 85% 90%, rgba(160,22,81,.22), transparent 60%),
    linear-gradient(165deg,var(--plum-deep),var(--ink) 55%);
}
.stage{height:100%;display:flex;align-items:center;justify-content:center}

/* ── далее 1-в-1 из index.html (hero-композит) ── */
.phone{position:relative;width:min(46vh,84vw);margin:0 auto;aspect-ratio:1080/1920;container-type:inline-size}
.phone-render{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 42px 80px rgba(0,0,0,.55)) drop-shadow(0 10px 26px rgba(160,22,81,.22))}
.phone-turn{display:none}
.phone.intro .phone-turn{display:block}
.phone-screen{transition:opacity .4s ease}
.phone.intro picture{visibility:hidden}
.phone.intro .phone-screen{opacity:0}
.phone.intro .phone-screen,.phone.intro .phone-screen *{animation-play-state:paused!important}
.phone-screen{position:absolute;left:18.06%;top:13.23%;width:63.8%;height:73.85%;
  border-radius:15% / 7.2%;overflow:hidden;background:linear-gradient(180deg,#1d0815,#120510);
  font-size:2.8cqw;padding:3.4em 1.15em 1em}
.phone-notch{position:absolute;top:1.9%;left:50%;transform:translateX(-50%);width:28%;height:1.75em;background:#050308;border-radius:99px;z-index:7}
.lockscreen{position:absolute;inset:0;z-index:5;overflow:hidden;color:#fff;
  background:
    radial-gradient(90% 60% at 22% 12%, rgba(255,130,180,.55), transparent 60%),
    radial-gradient(85% 70% at 86% 26%, rgba(160,22,81,.8), transparent 55%),
    radial-gradient(130% 85% at 50% 112%, #2a0a1f, transparent 70%),
    linear-gradient(158deg,#5c1542,#210a18);
  animation:unlock .75s var(--ease) 2.2s both}
.lock-lockicon{position:absolute;top:8.5%;left:50%;transform:translateX(-50%);width:1.6em;height:1.6em;opacity:.92}
.lock-lockicon svg{position:absolute;inset:0;width:100%;height:100%}
.lk-closed{animation:lkOut .3s ease 1.5s both}
.lk-open{opacity:0;animation:lkIn .38s var(--ease) 1.6s both}
.lock-clock{position:absolute;top:23%;left:0;right:0;text-align:center;text-shadow:0 2px 20px rgba(0,0,0,.25)}
.lock-date{font-size:.95em;font-weight:600;opacity:.92;margin-bottom:.15em}
.lock-time{font-family:var(--font-display);font-weight:600;font-size:4.6em;line-height:.95;letter-spacing:-.02em}
.lock-actions{position:absolute;bottom:5.5%;left:9%;right:9%;display:flex;justify-content:space-between}
.lock-actions i{width:2.4em;height:2.4em;border-radius:50%;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.lock-actions svg{width:1.2em;height:1.2em}
@keyframes unlock{0%,60%{transform:translateY(0);opacity:1}100%{transform:translateY(-16%);opacity:0;visibility:hidden}}
@keyframes lkOut{to{opacity:0;transform:scale(.7)}}
@keyframes lkIn{0%{opacity:0;transform:scale(.5)}60%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.tg-header{display:flex;align-items:center;gap:.7em;padding-bottom:1em;border-bottom:1px solid rgba(255,255,255,.06)}
.tg-ava{width:2.4em;height:2.4em;object-fit:contain;flex:none}
.tg-header .nm{font-weight:600;font-size:1.05em}
.tg-header .st{font-size:.8em;color:var(--muted)}
.bubble{
  background:#26102a;border-radius:1.15em 1.15em 1.15em .3em;padding:1em;margin-top:1em;
  border:1px solid rgba(255,93,143,.14);opacity:0;transform:translateY(1em);
  animation:bubbleIn .7s var(--ease) 3.1s forwards;
}
.bubble.b2{animation-delay:4s;background:#1f0c2a}
.bubble .ttl{font-size:.92em;color:var(--berry-bright);font-weight:600;display:flex;align-items:center;gap:.45em;margin-bottom:.6em}
.bubble .prod{font-size:.95em;color:#e7d3dd;line-height:1.35;margin-bottom:.7em}
.price-row{display:flex;align-items:baseline;gap:.55em}
.price-old{font-size:.9em;color:var(--muted);text-decoration:line-through}
.price-new{font-family:var(--font-display);font-weight:700;font-size:1.55em;color:#fff;white-space:nowrap}
.price-badge{margin-left:auto;font-size:.8em;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--berry),var(--berry-deep));padding:.2em .6em;border-radius:.5em;white-space:nowrap}
.bubble .meta{font-size:.78em;color:var(--muted);margin-top:.6em;line-height:1.3}
@keyframes bubbleIn{to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone intro">
    <video class="phone-render phone-turn" muted playsinline preload="auto"
           src="/hero-iphone-turn.webm" aria-hidden="true"></video>
    <picture>
      <source type="image/webp" srcset="/hero-iphone.webp">
      <img class="phone-render" src="/hero-iphone.png" width="1080" height="1920"
           alt="TryBerry в Telegram" fetchpriority="high" decoding="async">
    </picture>
    <div class="phone-screen">
      <div class="phone-notch"></div>
      <div class="lockscreen" aria-hidden="true">
        <div class="lock-lockicon">
          <svg class="lk-closed" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="11" width="14" height="9.5" rx="2.6"/><path d="M8 11V7.6a4 4 0 0 1 8 0V11" fill="none" stroke="#fff" stroke-width="2"/></svg>
          <svg class="lk-open" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="11" width="14" height="9.5" rx="2.6"/><path d="M8 11V7.6a4 4 0 0 1 7.7-1.6" fill="none" stroke="#fff" stroke-width="2"/></svg>
        </div>
        <div class="lock-clock">
          <div class="lock-date">сегодня</div>
          <div class="lock-time">9:41</div>
        </div>
        <div class="lock-actions">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M9 3h6l-1.2 5.5a2.8 2.8 0 0 1-5.6 0z"/><path d="M12 14v5" stroke-linecap="round"/></svg></i>
          <i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="4" y="7.5" width="16" height="11.5" rx="3"/><circle cx="12" cy="13.2" r="3"/><path d="M9 7.5 10 5.5h4L15 7.5" stroke-linejoin="round"/></svg></i>
        </div>
      </div>
      <div class="tg-header">
        <img src="/logo.png" class="tg-ava" alt="TryBerry">
        <div><div class="nm">TryBerry</div><div class="st">bot · онлайн</div></div>
      </div>
      <div class="bubble">
        <div class="ttl">📉 Цена снизилась</div>
        <div class="prod">Наушники беспроводные TWS, чёрные</div>
        <div class="price-row">
          <span class="price-old">2 490 ₽</span>
          <span class="price-new">1 690 ₽</span>
          <span class="price-badge">−32%</span>
        </div>
        <div class="meta">С учётом баллов за отзыв · ваш порог 1 800 ₽</div>
      </div>
      <div class="bubble b2">
        <div class="ttl">🔎 В вашей выдаче</div>
        <div class="prod">«кроссовки мужские» — 3 товара подешевели</div>
        <div class="meta">Слежу за всей страницей результатов</div>
      </div>
    </div>
  </div>
</div>

<script>
/* живая дата и время на мок-локскрине — ролик не устаревает */
(()=>{
  const d=new Date();
  const ld=document.querySelector('.lock-date');
  if(ld)ld.textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const lt=document.querySelector('.lock-time');
  if(lt)lt.textContent=d.toLocaleTimeString('ru-RU',{hour:'numeric',minute:'2-digit'});
})();
/* интро-разворот: как на лендинге, но без отсечки по таймауту сети —
   для записи важно дождаться видео, а не свалиться в статику */
(()=>{
  const ph=document.querySelector('.phone.intro');if(!ph)return;
  const v=ph.querySelector('.phone-turn');
  const end=()=>{ph.classList.remove('intro');if(v)try{v.pause()}catch(e){}};
  const saf=/apple/i.test(navigator.vendor||'');
  if(saf||!v||!v.canPlayType('video/webm; codecs="vp9"'))return end();
  v.addEventListener('ended',end,{once:true});
  v.addEventListener('error',end,{once:true});
  v.play().catch(end);
})();
/* клик = перезапуск сцены (новый дубль) */
addEventListener('pointerdown',()=>location.reload());
</script>
</body>
</html>
