<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#140310">
<title>TryBerry</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/screen/screen.css">
</head>
<body>
  <div id="stage">
   <section class="screen">
    <header class="head">
      <span class="back">‹</span>
      <span class="ava"><img src="/logo.png" alt=""></span>
      <span class="who">
        <span class="nm">TryBerry <span class="tick">✓</span></span>
        <span class="st">bot · онлайн</span>
      </span>
      <span class="dots">⋯</span>
    </header>

    <main class="thread">
      <div class="daysep">сегодня</div>

      <div class="typing t1"><i></i><i></i><i></i></div>
      <div class="msg m1">
        <div class="ttl">🎯 Цена ниже твоего порога</div>
        <div class="prod">iPhone 17 Pro Max, 256 ГБ, белый</div>
        <div class="price">
          <span class="new">71 305 ₽</span>
          <span class="badge">порог 75 000 ₽</span>
        </div>
        <div class="meta">Ozon · ты просил сообщить, когда будет дешевле 75 000 ₽</div>
        <time></time>
      </div>

      <div class="typing t2"><i></i><i></i><i></i></div>
      <div class="msg m2 alt">
        <div class="ttl">⏳ Может ненадолго</div>
        <div class="prod">Такие дропы быстро отыгрывают. Бери, пока цену не подняли обратно.</div>
        <time></time>
      </div>

    </main>

    <div class="composer">
      <span class="plus">＋</span>
      <span class="field">Сообщение</span>
      <span class="send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></span>
    </div>
   </section>
   <div class="tail"></div>
  </div>
  <script src="/screen/screen.js"></script>
</body>
</html>
