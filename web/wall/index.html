    background:
      radial-gradient(70% 45% at 50% 74%, rgba(255,93,143,.30), transparent 62%),
      radial-gradient(90% 60% at 82% 60%, rgba(160,22,81,.52), transparent 58%),
      radial-gradient(80% 55% at 16% 52%, rgba(120,20,70,.42), transparent 60%),
      linear-gradient(178deg,#0e0409 0%,#1a0714 42%,#3a0d2b 78%,#210a18 100%);
