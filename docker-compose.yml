
services:

  # ── WireGuard-туннель — РЕЗЕРВНОЕ плечо выхода к Telegram ────────────────
  # На RU-хостинге РКН режет Telegram. ОСНОВНОЙ выход теперь — VLESS (сервис
  # xray ниже); WG оставлен как fallback, к которому xray уходит автоматически,
  # если VLESS-узел отвалится. Сервисы НЕ ходят сюда напрямую — только через
  # xray (http://xray:8888), который сам выбирает плечо vless|wg.
  #   wg-proxy   — держит туннель wg0 (linuxserver/wireguard).
  #   tinyproxy  — HTTP CONNECT прокси в netns wg-proxy, слушает :8888.
  # Конфиг туннеля: ./wireguard/wg_confs/wg0.conf (секрет, см. wg0.conf.example).
  wg-proxy:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: pt_wg_proxy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE            # загрузка модуля wireguard, если не вкомпилен в ядро
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    # DNS задаём на уровне docker, а не строкой DNS= в wg0.conf: в контейнере
    # resolvconf часто не пишет /etc/resolv.conf → "bad address". tinyproxy
    # делит netns (network_mode: service:wg-proxy) и наследует этот resolv.conf.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Moscow"
    volumes:
      - ./wireguard:/config           # клиентский конфиг в ./wireguard/wg_confs/wg0.conf
      - /lib/modules:/lib/modules:ro
    restart: unless-stopped
    healthcheck:
      # Egress реально готов, только если: (1) с пиром есть handshake и
      # (2) дефолтный маршрут идёт через wg0 (его ставит PostUp в wg0.conf,
      # Table=off). Старая проверка "wg show wg0" зеленела даже при сломанной
      # маршрутизации — из-за чего tinyproxy стартовал на нерабочем туннеле.
      test:
        - "CMD-SHELL"
        - "wg show wg0 latest-handshakes | awk '{if($2+0>0) f=1} END{exit !f}' && ip route show default | grep -q 'dev wg0'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      logging: "promtail"
      service: "wg-proxy"

  # HTTP CONNECT-прокси внутри netns wg-proxy → весь его исходящий идёт в туннель.
  # Образ читает конфиг из /etc/tinyproxy/tinyproxy.conf.
  tinyproxy:
    image: vimagick/tinyproxy:latest
    container_name: pt_tinyproxy
    network_mode: "service:wg-proxy"  # делит сетевой стек с туннелем
    volumes:
      - ./wireguard/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
    depends_on:
      # Стартуем только когда туннель реально готов (handshake + маршрут).
      # Так tinyproxy не поднимается на «мёртвом» netns после пересоздания wg-proxy.
      wg-proxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # tinyproxy слушает :8888 в netns wg-proxy — зависимые сервисы ждут этого.
      test: ["CMD-SHELL", "netstat -ltn 2>/dev/null | grep -q ':8888 ' || ss -ltn 2>/dev/null | grep -q ':8888 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Выход к Telegram через VLESS (Xray), primary; WG — fallback ──────────
  # Xray держит локальный HTTP-прокси на :8888 и сам выбирает плечо выхода:
  #   outbound "vless" — основной не-RU exit (VLESS+Reality, TCP под HTTPS,
  #     РКН его почти не троттлит — в отличие от UDP-WireGuard);
  #   outbound "wg"    — резерв через http://wg-proxy:8888 (тот же WG-туннель).
  # observatory пробит оба плеча, balancer (leastPing) держит трафик на живом
  # и быстром. Сервисы ходят сюда как http://xray:8888 (HTTPS_PROXY).
  # Конфиг — СЕКРЕТ: ./xray/config.json (в .gitignore, см. config.json.example
  # и xray/README.md по заполнению из vless://-ссылки подписки).
  # ВАЖНО: xray НЕ зависит от wg-proxy — если WG-плечо лежит, VLESS работает.
  xray:
    image: teddysun/xray:latest
    container_name: pt_xray
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    healthcheck:
      # Готовность = inbound :8888 слушает. Реальное здоровье плеч (vless/wg)
      # держит сам observatory внутри Xray, не healthcheck контейнера.
      test: ["CMD-SHELL", "netstat -ltn 2>/dev/null | grep -q ':8888 ' || ss -ltn 2>/dev/null | grep -q ':8888 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      logging: "promtail"
      service: "xray"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api
        # Короткий хеш коммита → ?v= у css/js (сброс кэша ассетов при деплое).
        # Деплой: GIT_COMMIT=$(git rev-parse --short HEAD) docker compose ... build api
        GIT_COMMIT: "${GIT_COMMIT:-dev}"
    container_name: pt_api
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "price-tracker"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET}"
      WEBHOOK_ENABLED: "${WEBHOOK_ENABLED:-false}"
      OTLP_ENDPOINT: "jaeger:4317"
      PORT: "8081"
      # Базовый публичный URL для canonical/OG/sitemap страниц графиков (/p/).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://tryberry.ru}"
      ADMIN_IDS: "${ADMIN_IDS}"
      SCRAPE_INTERVAL_MINUTES: "10"
      # Egress к Telegram через WireGuard (wg-proxy + tinyproxy). Внутренние
      # сервисы — мимо прокси (NO_PROXY). TELEGRAM_PROXY_URL больше не используется.
      HTTPS_PROXY: "http://xray:8888"
      TELEGRAM_POLL_TIMEOUT_SECONDS: "${TELEGRAM_POLL_TIMEOUT_SECONDS:-10}"
      # api.yookassa.ru — мимо прокси: платёжка РФ, пусть видит RU-IP сервера,
      # а не немецкий exit (anti-fraud/гео). Вебхук перечитывает статус платежа.
      NO_PROXY: "postgres,redis,kafka,jaeger,localhost,127.0.0.1,api.vk.com,api.yookassa.ru,platform-api2.max.ru"
      # VK Callback API (пусто = выключено). Значения из настроек сообщества VK.
      VK_CONFIRMATION: "${VK_CONFIRMATION:-}"
      VK_CALLBACK_SECRET: "${VK_CALLBACK_SECRET:-}"
      # MAX Bot API (пусто = webhook не монтируется). MAX_WEBHOOK_URL — публичный
      # https-URL вида https://tryberry.ru/max/callback (подписка на старте).
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_CALLBACK_SECRET: "${MAX_CALLBACK_SECRET:-}"
      MAX_WEBHOOK_URL: "${MAX_WEBHOOK_URL:-}"
      # Оплата ЮKassa (пусто = вебхук не монтируется). Секреты — из .env.
      YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
      YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
      # Робокасса: вебхук /robokassa/result монтируется при заданных LOGIN+PASSWORD2.
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-yookassa}"
      ROBOKASSA_MERCHANT_LOGIN: "${ROBOKASSA_MERCHANT_LOGIN:-}"
      ROBOKASSA_PASSWORD2: "${ROBOKASSA_PASSWORD2:-}"
      ROBOKASSA_HASH_TYPE: "${ROBOKASSA_HASH_TYPE:-md5}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
      xray:
        condition: service_healthy
    labels:
      # Лейблы для Promtail — он по ним группирует логи в Loki
      logging: "promtail"
      service: "api"

  bot-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: bot-worker
    container_name: pt_bot_worker
    environment:
      DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "bot-workers"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      BOT_WORKER_HEALTH_PORT: "8093"
      OTLP_ENDPOINT: "jaeger:4317"
      # Базовый публичный URL сайта — для кнопки «📈 График цены» (ссылка на /p/).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://tryberry.ru}"
      # Egress к Telegram (ответы) через WireGuard (wg-proxy + tinyproxy).
      # api.vk.com — мимо прокси: VK доступен с RU-VM напрямую.
      HTTPS_PROXY: "http://xray:8888"
      # api.yookassa.ru — мимо прокси (RU-IP сервера, см. api). Создание платежей.
      NO_PROXY: "postgres,redis,kafka,jaeger,localhost,127.0.0.1,api.vk.com,api.yookassa.ru,platform-api2.max.ru"
      ADMIN_IDS: "${ADMIN_IDS}"
      # VK-бот (пусто = выключено): токен сообщества + ссылка для кнопки привязки.
      VK_GROUP_TOKEN: "${VK_GROUP_TOKEN:-}"
      VK_BOT_URL: "${VK_BOT_URL:-}"
      # VK-операторы для админ-команд (vk_id через запятую; пусто = админа в VK нет).
      VK_ADMIN_IDS: "${VK_ADMIN_IDS:-}"
      # MAX-бот (пусто = выключено): токен + ссылка для приглашений + операторы.
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_BOT_URL: "${MAX_BOT_URL:-}"
      MAX_ADMIN_IDS: "${MAX_ADMIN_IDS:-}"
      # Оплата ЮKassa (пусто = витрина показывает заглушку). Секреты — из .env.
      YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
      YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
      # Нейтральная страница «спасибо» с кнопками TG+VK (годится и для VK-only юзеров,
      # которых раньше редиректило на t.me — тупик без Telegram). Статика nginx.
      YOOKASSA_RETURN_URL: "${YOOKASSA_RETURN_URL:-https://tryberry.ru/spasibo/}"
      # Ставка НДС в чеке 54-ФЗ. Самозанятый (НПД) → 1 = «без НДС».
      YOOKASSA_VAT_CODE: "${YOOKASSA_VAT_CODE:-1}"
      # Робокасса (выбор провайдера через PAYMENT_PROVIDER=robokassa). Секреты — из .env.
      # Для теста: ROBOKASSA_IS_TEST=1 + тестовые пароли. SNO/NPD — формат чека НПД.
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-yookassa}"
      ROBOKASSA_MERCHANT_LOGIN: "${ROBOKASSA_MERCHANT_LOGIN:-}"
      ROBOKASSA_PASSWORD1: "${ROBOKASSA_PASSWORD1:-}"
      ROBOKASSA_PASSWORD2: "${ROBOKASSA_PASSWORD2:-}"
      ROBOKASSA_IS_TEST: "${ROBOKASSA_IS_TEST:-0}"
      ROBOKASSA_HASH_TYPE: "${ROBOKASSA_HASH_TYPE:-md5}"
      ROBOKASSA_SNO: "${ROBOKASSA_SNO:-npd}"
      ROBOKASSA_NPD: "${ROBOKASSA_NPD:-1}"
      # Рекуррент (подписка) — включать "1" только после активации менеджером Робокассы,
      # иначе ссылка подписки = ошибка 34. До этого в боте видна только разовая оплата.
      ROBOKASSA_RECURRING: "${ROBOKASSA_RECURRING:-0}"
      BILLING_CHARGE_INTERVAL_MINUTES: "${BILLING_CHARGE_INTERVAL_MINUTES:-60}"
      # Ozon: бот при /track скрейпит сразу → нужен тот же мобильный РФ-прокси,
      # что у scraper (tls-client ходит через него напрямую, мимо HTTPS_PROXY).
      OZON_PROXY_URL: "${OZON_PROXY_URL:-}"
      OZON_API_MODE: "${OZON_API_MODE:-mobile}"
      # browser-режим: тот же сайдкар-пул, что у scraper.
      OZON_BROWSER_URL: "${OZON_BROWSER_URL:-http://ozon-miner:8080}"
      # Путь B (аккаунт-токены): Ozon ходит под залогиненной аккаунт-сессией.
      # Секреты — в .env, в логи не пишутся (только cookie_len).
      OZON_ACCESS_TOKEN: "${OZON_ACCESS_TOKEN:-}"
      OZON_REFRESH_TOKEN: "${OZON_REFRESH_TOKEN:-}"
      # Готовая cookie-строка из приложения (HTTP Toolkit) — приоритетнее токенов.
      OZON_COOKIE: "${OZON_COOKIE:-}"
      # Я.Маркет: без аккаунта (цена публичная), хороший TLS + RU-прокси. Пусто →
      # код фолбэчит на OZON_PROXY_URL (тот же мобильный IP). Дележ IP ускоряет
      # его выгорание (см. OZON-STATUS) — при росте нагрузки задать отдельный.
      YANDEX_PROXY_URL: "${YANDEX_PROXY_URL:-}"
      # AliExpress: бот при /track скрейпит сразу. Прокси нужен для рефреша cookie
      # (с датацентра cold-сессия = капча), дальше запросы напрямую. Пусто → фолбэк
      # на OZON_PROXY_URL (дележ IP жжёт его — при нагрузке задать отдельный).
      ALI_PROXY_URL: "${ALI_PROXY_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
      xray:
        condition: service_healthy
    labels:
      logging: "promtail"
      service: "bot-worker"

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: scraper
    container_name: pt_scraper
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "price-tracker"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      SCRAPER_RATE_LIMIT_RPS: "5"
      SCRAPER_RATE_LIMIT_RPS_OZON: "1"
      # u-card-fallback (трансграничные WB-товары, basket-CDN их не видит) через
      # xray: u-card 403-ит прямой RU-IP воркера, зарубежный exit принимает. Нагрузка
      # копеечная — только редкие трансграничные. Пусто → fallback идёт напрямую (403).
      WB_UCARD_PROXY_URL: "${WB_UCARD_PROXY_URL:-http://xray:8888}"
      # Мобильный РФ-прокси Ozon (путь B: аккаунт-сессия проходит FAB через
      # доверенный IP). Sticky/ротация 0. Секрет — в .env.
      OZON_PROXY_URL: "${OZON_PROXY_URL:-}"
      # Эндпоинт Ozon: mobile (composer-api.bx) | web (entrypoint-api.bx) |
      # browser (через сайдкар-пул ozon-miner — проходит FAB живой сессией).
      OZON_API_MODE: "${OZON_API_MODE:-mobile}"
      # browser-режим: URL сайдкара пула дорожек (см. сервис ozon-miner).
      OZON_BROWSER_URL: "${OZON_BROWSER_URL:-http://ozon-miner:8080}"
      # Путь B (аккаунт-токены) — секреты из .env, в логи не пишутся.
      OZON_ACCESS_TOKEN: "${OZON_ACCESS_TOKEN:-}"
      OZON_REFRESH_TOKEN: "${OZON_REFRESH_TOKEN:-}"
      # Готовая cookie-строка из приложения (HTTP Toolkit) — приоритетнее токенов.
      OZON_COOKIE: "${OZON_COOKIE:-}"
      SCRAPER_RATE_LIMIT_RPS_YANDEX: "${SCRAPER_RATE_LIMIT_RPS_YANDEX:-2}"
      # Я.Маркет: без аккаунта, хороший TLS + RU-прокси. Пусто → код фолбэчит на
      # OZON_PROXY_URL. При росте нагрузки задать отдельный (дележ IP жжёт его).
      YANDEX_PROXY_URL: "${YANDEX_PROXY_URL:-}"
      SCRAPER_RATE_LIMIT_RPS_ALI: "${SCRAPER_RATE_LIMIT_RPS_ALI:-1}"
      # AliExpress: внутренний JSON-API (aer-jsonapi), без браузера. X5SEC решает
      # репутация IP → нужен RU-резидентский/мобильный прокси (датацентр = капча).
      # Пусто → фолбэк на OZON_PROXY_URL (дележ IP жжёт его — при нагрузке отдельный).
      ALI_PROXY_URL: "${ALI_PROXY_URL:-}"
      SCRAPER_HEALTH_PORT: "8090"
      OTLP_ENDPOINT: "jaeger:4317"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: "promtail"
      service: "scraper"

  # ── Поиск-воркер: обычная дорожка (search-tasks) ───────────────────────────
  search-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: search-worker
    container_name: pt_search_worker
    environment:
      DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "search-workers"
      SEARCH_TASKS_TOPIC: "search-tasks"
      WB_TOKEN_POOL_PREFIX: "wb:search:"
      WB_TOKEN_POOL_SIZE: "5"
      SEARCH_SCRAPE_INTERVAL_MINUTES: "20"
      SEARCH_MAX_PAGES: "5"
      SEARCH_PAGE_DELAY_MS: "700"
      SEARCH_MAX_ITEMS_OZON: "${SEARCH_MAX_ITEMS_OZON:-72}"
      # Анти-спам below_target на широких/ротирующихся выдачах: не чаще раза в N мин.
      SEARCH_BELOW_TARGET_COOLDOWN_MINUTES: "${SEARCH_BELOW_TARGET_COOLDOWN_MINUTES:-360}"
      SEARCH_WORKER_HEALTH_PORT: "8094"
      OTLP_ENDPOINT: "jaeger:4317"
      # Я.Маркет-поиск ходит тем же tls-client + RU-прокси, что и карточный
      # scraper/bot-worker — иначе датацентровый IP ловит SmartCaptcha. Пусто →
      # код фолбэчит на OZON_PROXY_URL (см. cmd/search-worker/main.go).
      OZON_PROXY_URL: "${OZON_PROXY_URL:-}"
      YANDEX_PROXY_URL: "${YANDEX_PROXY_URL:-}"
      # Ozon-поиск идёт ТОЛЬКО через сайдкар ozon-miner (browser-пул): прямой API
      # за FAB. /search дёргает выдачу из прогретой дорожки (searchResultsV2).
      OZON_BROWSER_URL: "${OZON_BROWSER_URL:-http://ozon-miner:8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: "promtail"
      service: "search-worker"

  # ── Поиск-воркер: дорожка перекупов (reseller-tasks) ───────────────────────
  # Масштабируется независимо: docker compose up -d --scale reseller-worker=N
  # (поэтому без container_name и без публикации портов). Партиций у топика
  # reseller-tasks хватает на 10 реплик (KAFKA_NUM_PARTITIONS). Отдельный пул
  # токенов (wb:reseller:) наполняет token-miner-reseller со своим egress.
  reseller-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: search-worker
    environment:
      DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "reseller-workers"
      SEARCH_TASKS_TOPIC: "reseller-tasks"
      WB_TOKEN_POOL_PREFIX: "wb:reseller:"
      WB_TOKEN_POOL_SIZE: "5"
      SEARCH_SCRAPE_INTERVAL_MINUTES: "20"
      # Reseller — премиум-тариф: даём WB-поиску покрытие 3 стр (300) против 2 у
      # бесплатной дорожки. WB-каталог дёшев, поэтому +1 страница ничего не стоит.
      SEARCH_MAX_PAGES: "3"
      SEARCH_PAGE_DELAY_MS: "400"
      SEARCH_MAX_ITEMS_OZON: "${SEARCH_MAX_ITEMS_OZON:-72}"
      SEARCH_BELOW_TARGET_COOLDOWN_MINUTES: "${SEARCH_BELOW_TARGET_COOLDOWN_MINUTES:-360}"
      SEARCH_PROXY_URLS: "${RESELLER_SEARCH_PROXY_URLS:-}"
      SEARCH_WORKER_HEALTH_PORT: "8094"
      OTLP_ENDPOINT: "jaeger:4317"
      # Я.Маркет-поиск на быстрых тарифах (interval ≤ resellerLaneCutoff)
      # попадает на ЭТУ дорожку — нужны те же RU-прокси, что у scraper, иначе
      # SmartCaptcha. Пусто → фолбэк на OZON_PROXY_URL (cmd/search-worker/main.go).
      OZON_PROXY_URL: "${OZON_PROXY_URL:-}"
      YANDEX_PROXY_URL: "${YANDEX_PROXY_URL:-}"
      # Ozon-поиск на быстрых тарифах идёт ТОЖЕ сюда → нужен сайдкар ozon-miner
      # (browser-пул), как у search-worker. ВНИМАНИЕ: перекуп-каданс (≤1 мин) для
      # Ozon агрессивен для одной прогретой дорожки — следить за блокировками.
      OZON_BROWSER_URL: "${OZON_BROWSER_URL:-http://ozon-miner:8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: "promtail"
      service: "reseller-worker"

  notifier:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notifier
    container_name: pt_notifier
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "price-tracker"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      NOTIFIER_HEALTH_PORT: "8091"
      OTLP_ENDPOINT: "jaeger:4317"
      # Базовый публичный URL сайта — для кнопки «📈 График цены» в пушах (/p/).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://tryberry.ru}"
      # Egress к Telegram (уведомления) через WireGuard (wg-proxy + tinyproxy).
      # api.vk.com — мимо прокси: VK доступен напрямую.
      HTTPS_PROXY: "http://xray:8888"
      NO_PROXY: "postgres,redis,kafka,jaeger,localhost,127.0.0.1,api.vk.com,platform-api2.max.ru"
      # VK-доставка уведомлений (пусто = выключено, всё идёт в Telegram).
      VK_GROUP_TOKEN: "${VK_GROUP_TOKEN:-}"
      # MAX-доставка уведомлений (пусто = выключено).
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      # Еженедельный дайджест «хорошие цены сейчас». Выкл по умолчанию (шлёт всем
      # юзерам — включать осознанно). DIGEST_BATCH — юзеров на тик (раз в час).
      DIGEST_ENABLED: "${DIGEST_ENABLED:-false}"
      DIGEST_INTERVAL_DAYS: "${DIGEST_INTERVAL_DAYS:-7}"
      DIGEST_BATCH: "${DIGEST_BATCH:-100}"
      # Дневное окно рассылки (UTC) и период тика. Для теста «сейчас»: окно 0..24 +
      # тик 1 мин (увидишь свой дайджест в течение минуты), потом верни 6/18/60.
      DIGEST_HOUR_START: "${DIGEST_HOUR_START:-6}"
      DIGEST_HOUR_END: "${DIGEST_HOUR_END:-18}"
      DIGEST_TICK_MINUTES: "${DIGEST_TICK_MINUTES:-60}"
      # Канарейка: DIGEST_TEST_TG_IDS=<твой_tg_id> — слать дайджест ТОЛЬКО себе.
      # DIGEST_MIN_AGE_DAYS=0 — снять 7-дн. гейт (свежие товары попадут). В проде не задавать.
      DIGEST_TEST_TG_IDS: "${DIGEST_TEST_TG_IDS:-}"
      DIGEST_MIN_AGE_DAYS: "${DIGEST_MIN_AGE_DAYS:--1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
      xray:
        condition: service_healthy
    labels:
      logging: "promtail"
      service: "notifier"

  token-miner:
      build:
        context: ./token-miner
        dockerfile: Dockerfile
      container_name: pt_token_miner
      init: true
      environment:
        REDIS_URL: "redis://redis:6379"
        WB_TOKEN_POOL_SIZE: "5"
        WB_SEARCH_QUERY: "телефон"
        MINE_INTERVAL_HOURS: "12"
        MINE_RETRY_MINUTES: "10"
        MINE_MAX_RELOADS: "2"
        MINE_TIMEOUT_SECONDS: "150"
        # Прокси для майнинга WB-токенов — секрет, из .env (раньше был захардкожен
        # резидентский lteboost, истёк). Сейчас гоняем через мобильный РФ-прокси.
        WB_TOKEN_PROXY_URL: "${WB_TOKEN_PROXY_URL:-}"
        # Общий лок майнинга: обычный и reseller-майнер делят один мобильный IP —
        # один ключ не даёт им майнить одновременно (всплеск минтов палит WB).
        MINE_GLOBAL_LOCK: "wb:mine:lock"
        HEADLESS: "false"
        LOG_LEVEL: "INFO"
      shm_size: "1gb"
      depends_on:
        redis:
          condition: service_healthy
      labels:
        logging: "promtail"
        service: "token-miner"

  # ── Майнер пула токенов перекупов (wb:reseller:) ───────────────────────────
  # Отдельный пул со своим egress-прокси (чтобы exit-IP не пересекались с
  # обычной дорожкой и не делили rate-limit WB). Размер пула должен совпадать
  # с WB_TOKEN_POOL_SIZE у reseller-worker; при сокращении удалить хвостовые
  # слоты wb:reseller:pool:{i} из Redis — Go-пул не проверяет exp.
  token-miner-reseller:
      build:
        context: ./token-miner
        dockerfile: Dockerfile
      container_name: pt_token_miner_reseller
      init: true
      environment:
        REDIS_URL: "redis://redis:6379"
        WB_TOKEN_POOL_PREFIX: "wb:reseller:"
        WB_DISABLE_LEGACY_MIRROR: "true"
        WB_TOKEN_POOL_SIZE: "5"
        WB_SEARCH_QUERY: "телефон"
        MINE_CHECK_INTERVAL_MINUTES: "3"
        MINE_RETRY_MINUTES: "5"
        MINE_MAX_RELOADS: "2"
        MINE_TIMEOUT_SECONDS: "150"
        WB_TOKEN_PROXY_URL: "${RESELLER_TOKEN_PROXY_URL:-}"
        # Тот же лок, что у обычного майнера → не майнят одновременно с общего IP.
        MINE_GLOBAL_LOCK: "wb:mine:lock"
        HEADLESS: "false"
        LOG_LEVEL: "INFO"
      shm_size: "1gb"
      depends_on:
        redis:
          condition: service_healthy
      labels:
        logging: "promtail"
        service: "token-miner-reseller"

  # ── Ozon miner: браузер-как-транспорт, пул дорожек ─────────────────────────
  # Долгоживущий сервис: на каждую дорожку — залогиненный Chromium через свой
  # мобильный прокси и свою аккаунт-cookie. Проходит FAB живой сессией и сам
  # рефрешит токен. Go-скрейпер (OZON_API_MODE=browser, OZON_BROWSER_URL) зовёт
  # GET /scrape?id=… по внутренней сети — портов наружу нет.
  # Масштабирование: поднять OZON_POOL_SIZE и задать OZON_LANE_<i>_PROXY/_COOKIE
  # (по IP+аккаунту на дорожку). Старт N=1: дорожка 0 фолбэчит на
  # OZON_PROXY_URL / OZON_COOKIE.
  ozon-miner:
      build:
        context: ./ozon-miner
        dockerfile: Dockerfile
      container_name: pt_ozon_miner
      init: true
      environment:
        OZON_MINER_PORT: "8080"
        OZON_POOL_SIZE: "${OZON_POOL_SIZE:-1}"
        # Дорожка 0 (legacy-фолбэк). Доп. дорожки — OZON_LANE_1_PROXY/_COOKIE и т.д.
        OZON_PROXY_URL: "${OZON_PROXY_URL:-}"
        OZON_COOKIE: "${OZON_COOKIE:-}"
        OZON_LANE_1_PROXY: "${OZON_LANE_1_PROXY:-}"
        OZON_LANE_1_COOKIE: "${OZON_LANE_1_COOKIE:-}"
        OZON_LANE_2_PROXY: "${OZON_LANE_2_PROXY:-}"
        OZON_LANE_2_COOKIE: "${OZON_LANE_2_COOKIE:-}"
        # Человекоподобный интервал между запросами одной дорожки + джиттер.
        OZON_LANE_MIN_INTERVAL_MS: "${OZON_LANE_MIN_INTERVAL_MS:-1500}"
        OZON_LANE_JITTER: "${OZON_LANE_JITTER:-0.4}"
        # Периодический re-warm живой сессии (рефреш токена/доверия), мин.
        OZON_WARM_KEEPALIVE_MINUTES: "${OZON_WARM_KEEPALIVE_MINUTES:-45}"
        # Ротация IP: switch-ссылка провайдера + период (мин, 0=выкл). Частую
        # можно, но каждая ротация = пере-прогрев (заново FAB на новом IP).
        OZON_PROXY_ROTATE_URL: "${OZON_PROXY_ROTATE_URL:-}"
        OZON_ROTATE_INTERVAL_MINUTES: "${OZON_ROTATE_INTERVAL_MINUTES:-0}"
        HEADLESS: "false"
        LOG_LEVEL: "INFO"
      shm_size: "1gb"
      labels:
        logging: "promtail"
        service: "ozon-miner"

  scheduler:
      build:
        context: .
        dockerfile: Dockerfile
        args:
          SERVICE: scheduler
      container_name: pt_scheduler
      environment:
        DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
        KAFKA_BROKERS: "kafka:29092"
        SCRAPE_INTERVAL_MINUTES: "15"
        OZON_MIN_INTERVAL_MINUTES: "${OZON_MIN_INTERVAL_MINUTES:-20}"
        # Ozon идёт кадансом тарифа × этот множитель (free 60→120 мин и т.д.);
        # reseller-планы Ozon не тянут. Антибот не любит частоту.
        OZON_INTERVAL_MULTIPLIER: "${OZON_INTERVAL_MULTIPLIER:-2}"
        # Пол интервала Ozon-ПОИСКА (выдача ротируется, одна прогретая дорожка):
        # не чаще этого даже на быстрых тарифах → уводит Ozon с reseller-дорожки.
        OZON_SEARCH_MIN_INTERVAL_MINUTES: "${OZON_SEARCH_MIN_INTERVAL_MINUTES:-30}"
        SCHEDULER_TICK_SECONDS: "20"
        SCHEDULER_HEALTH_PORT: "8092"
        OTLP_ENDPOINT: "jaeger:4317"
      depends_on:
        postgres:
          condition: service_healthy
        kafka:
          condition: service_healthy
        jaeger:
          condition: service_started
      labels:
        logging: "promtail"
        service: "scheduler"

  postgres:
    image: postgres:16
    container_name: pt_postgres
    # Тюнинг под сервер 8 CPU / 16 ГБ RAM / NVMe (дефолты PG рассчитаны на
    # машину прошлого века: shared_buffers=128MB и т.п.). PG здесь не один —
    # рядом Kafka и два Chromium-майнера, поэтому берём умеренные ~25% RAM.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
    shm_size: 1gb
    environment:
      POSTGRES_DB: tryberrybot
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tryberrybot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pt_redis
    # Потолок памяти, чтобы Redis не разрастался бесконтрольно. Политика
    # volatile-lru: вытесняются ТОЛЬКО ключи с TTL (FSM, коды привязки,
    # price-cache) — пулы WB-токенов без TTL не трогаются.
    # AOF + volume: пулы WB-токенов и FSM переживают пересоздание контейнера.
    # Без этого каждый recreate redis стирал пулы → полный перемайн через
    # резидентный прокси (основной источник расхода трафика lteboost).
    command:
      - redis-server
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # Хардинг после инцидента 2026-07-03 (rogue-replica attack): отключаем
      # репликацию и загрузку модулей — мы их не используем, а это ровно векторы
      # атаки (REPLICAOF на чужой мастер + MODULE LOAD = RCE). Defense-in-depth
      # поверх закрытых портов.
      - --rename-command
      - REPLICAOF
      - ""
      - --rename-command
      - SLAVEOF
      - ""
      - --rename-command
      - MODULE
      - ""
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pt_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pt_kafka
    depends_on: [zookeeper]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # ВНУТРЕННИЙ listener для общения между контейнерами (kafka-exporter, etc)
      # ВНЕШНИЙ listener для подключения с хоста (наши Go-сервисы)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 10
      # События транзитные (апдейты, цены, поисковые хиты) — 3 суток с запасом
      # на любой даунтайм консьюмеров; дефолтные 7 дней просто жгли диск.
      KAFKA_LOG_RETENTION_HOURS: 72
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── Observability ─────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pt_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 180 ГБ NVMe позволяют хранить больше истории; на всякий случай ещё и
      # потолок по размеру (срабатывает то, что наступит раньше).
      - '--storage.tsdb.retention.time=60d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'  # позволяет reload конфига без рестарта
    # Linux — нужен extra_hosts чтобы достучаться до хоста
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.2.0
    container_name: pt_loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'

  promtail:
    image: grafana/promtail:3.2.0
    container_name: pt_promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-config.file=/etc/promtail/config.yml'
    depends_on:
      - loki

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pt_postgres_exporter
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://user:password@postgres:5432/tryberrybot?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: pt_redis_exporter
    ports:
      - "127.0.0.1:9121:9121"
    command:
      - '--redis.addr=redis://redis:6379'
      - '--check-single-keys=wb:search:token:mined_at,wb:search:token:exp,wb:search:pool:healthy,wb:search:pool:oldest_mined_at,wb:search:pool:mined_total,wb:search:pool:mine_failed_total,wb:reseller:pool:healthy,wb:reseller:pool:oldest_mined_at,wb:reseller:pool:mined_total,wb:reseller:pool:mine_failed_total'
    depends_on:
      redis:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: pt_kafka_exporter
    ports:
      - "127.0.0.1:9308:9308"
    command:
      - '--kafka.server=kafka:29092'
    depends_on:
      kafka:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pt_alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager:/config:ro
      - alertmanager_data:/alertmanager
    environment:
      TELEGRAM_ALERT_BOT_TOKEN: "${TELEGRAM_ALERT_BOT_TOKEN}"
      TELEGRAM_ALERT_CHAT_ID: "${TELEGRAM_ALERT_CHAT_ID}"
    user: root
    entrypoint: [ "/bin/sh", "/config/entrypoint.sh" ]


  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pt_jaeger
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC (куда сервисы шлют спаны)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Хранение в памяти — для пет-проекта норм
      SPAN_STORAGE_TYPE: "memory"
      # Лимит спанов в памяти, дальше старые вытесняются
      MEMORY_MAX_TRACES: "50000"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pt_grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Анонимный доступ для удобства разработки (на проде отключим)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
      - loki
      - jaeger

#  node-exporter:
#    image: prom/node-exporter:v1.8.2
#    container_name: pt_node_exporter
#    ports:
#      - "9100:9100"
#    command:
#      - '--path.rootfs=/host'
#    volumes:
#      - /:/host:ro,rslave
#    pid: host

volumes:
  pgdata:
  redis_data:
  prometheus_data:
  loki_data:
  alertmanager_data:
  grafana_data:
