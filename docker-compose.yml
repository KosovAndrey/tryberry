
services:

  # ── Выход к Telegram через VLESS (Xray) ──────────────────────────────────
  # На RU-хостинге РКН режет Telegram. Xray держит локальный HTTP-прокси на
  # :8888 и балансирует VLESS+Reality-узлы (TCP под HTTPS, РКН почти не
  # троттлит): observatory пробит плечи, balancer (leastPing) держит трафик
  # на живом и быстром. Сервисы ходят сюда как http://xray:8888 (HTTPS_PROXY).
  # WG-fallback (wg-proxy + tinyproxy) выпилен 2026-07-11: UDP-WireGuard
  # окончательно умер (handshake без ответа при живом хосте — DPI), а
  # unhealthy wg-proxy обрывал каждый полный `up -d`.
  # Конфиг — СЕКРЕТ: ./xray/config.json (в .gitignore, см. config.json.example
  # и xray/README.md по заполнению из vless://-ссылки подписки).
  xray:
    image: teddysun/xray:latest
    container_name: pt_xray
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    healthcheck:
      # Готовность = inbound :8888 слушает. Реальное здоровье vless-плеч
      # держит сам observatory внутри Xray, не healthcheck контейнера.
      test: ["CMD-SHELL", "netstat -ltn 2>/dev/null | grep -q ':8888 ' || ss -ltn 2>/dev/null | grep -q ':8888 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      logging: "promtail"
      service: "xray"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api
        # Короткий хеш коммита → ?v= у css/js (сброс кэша ассетов при деплое).
        # Деплой: GIT_COMMIT=$(git rev-parse --short HEAD) docker compose ... build api
        GIT_COMMIT: "${GIT_COMMIT:-dev}"
    container_name: pt_api
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DATABASE_URL: "postgres://tryberry_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "price-tracker"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      # Пустые дефолты: в polling-режиме (прод) вебхук выключен, этих переменных
      # в .env нет — без дефолта compose сыпал warning на каждый up.
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL:-}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      WEBHOOK_ENABLED: "${WEBHOOK_ENABLED:-false}"
      OTLP_ENDPOINT: "jaeger:4317"
      PORT: "8081"
      # Базовый публичный URL для canonical/OG/sitemap страниц графиков (/p/).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://tryberry.ru}"
      ADMIN_IDS: "${ADMIN_IDS}"
      SCRAPE_INTERVAL_MINUTES: "10"
      # Egress к Telegram через xray (VLESS). Внутренние сервисы — мимо
      # прокси (NO_PROXY). TELEGRAM_PROXY_URL больше не используется.
      HTTPS_PROXY: "http://xray:8888"
      TELEGRAM_POLL_TIMEOUT_SECONDS: "${TELEGRAM_POLL_TIMEOUT_SECONDS:-10}"
      # api.yookassa.ru — мимо прокси: платёжка РФ, пусть видит RU-IP сервера,
      # а не немецкий exit (anti-fraud/гео). Вебхук перечитывает статус платежа.
      NO_PROXY: "postgres,redis,kafka,jaeger,localhost,127.0.0.1,api.vk.com,api.yookassa.ru,platform-api2.max.ru"
      # VK Callback API (пусто = выключено). Значения из настроек сообщества VK.
      VK_CONFIRMATION: "${VK_CONFIRMATION:-}"
      VK_CALLBACK_SECRET: "${VK_CALLBACK_SECRET:-}"
      # MAX Bot API (пусто = webhook не монтируется). MAX_WEBHOOK_URL — публичный
      # https-URL вида https://tryberry.ru/max/callback (подписка на старте).
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_CALLBACK_SECRET: "${MAX_CALLBACK_SECRET:-}"
      MAX_WEBHOOK_URL: "${MAX_WEBHOOK_URL:-}"
      # Оплата ЮKassa (пусто = вебхук не монтируется). Секреты — из .env.
      YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
      YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
      # Робокасса: вебхук /robokassa/result монтируется при заданных LOGIN+PASSWORD2.
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-yookassa}"
      ROBOKASSA_MERCHANT_LOGIN: "${ROBOKASSA_MERCHANT_LOGIN:-}"
      ROBOKASSA_PASSWORD2: "${ROBOKASSA_PASSWORD2:-}"
      ROBOKASSA_HASH_TYPE: "${ROBOKASSA_HASH_TYPE:-md5}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
      xray:
        condition: service_healthy
    labels:
      # Лейблы для Promtail — он по ним группирует логи в Loki
      logging: "promtail"
      service: "api"

  bot-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: bot-worker
    container_name: pt_bot_worker
    environment:
      DATABASE_URL: "postgres://tryberry_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "bot-workers"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      BOT_WORKER_HEALTH_PORT: "8093"
      OTLP_ENDPOINT: "jaeger:4317"
      # Базовый публичный URL сайта — для кнопки «📈 График цены» (ссылка на /p/).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://tryberry.ru}"
      # База для ссылок, которые бот КЛАДЁТ В СООБЩЕНИЯ пользователю (график
      # /p/<public_id>, оферта, политика). Отделена от PUBLIC_BASE_URL, который
      # остаётся каноническим адресом для SEO: если основной домен где-то
      # заблокирован (Safari на iOS показывает «Обманчивый сайт» по записи
      # Apple — docs/SAFE-BROWSING-APPEAL.md), ссылки пользователям можно
      # увести на рабочее зеркало, не трогая индексацию. Пусто → PUBLIC_BASE_URL.
      USER_LINK_BASE_URL: "${USER_LINK_BASE_URL:-}"
      # Egress к Telegram (ответы) через xray (VLESS).
      # api.vk.com — мимо прокси: VK доступен с RU-VM напрямую.
      HTTPS_PROXY: "http://xray:8888"
      # api.yookassa.ru — мимо прокси (RU-IP сервера, см. api). Создание платежей.
      NO_PROXY: "postgres,redis,kafka,jaeger,localhost,127.0.0.1,api.vk.com,api.yookassa.ru,platform-api2.max.ru"
      # Живая цена WB при /track (u-card едет через тот же xray из HTTPS_PROXY).
      # Рубильник — см. WB_UCARD_PRIMARY у scraper.
      WB_UCARD_PRIMARY: "${WB_UCARD_PRIMARY:-true}"
      ADMIN_IDS: "${ADMIN_IDS}"
      # VK-бот (пусто = выключено): токен сообщества + ссылка для кнопки привязки.
      VK_GROUP_TOKEN: "${VK_GROUP_TOKEN:-}"
      VK_BOT_URL: "${VK_BOT_URL:-}"
      # VK-операторы для админ-команд (vk_id через запятую; пусто = админа в VK нет).
      VK_ADMIN_IDS: "${VK_ADMIN_IDS:-}"
      # TG-бот: ссылка для одноклик-кнопки «Привязать в Telegram» из MAX
      # (пусто = кнопки нет, работает ручной ввод кода).
      TELEGRAM_BOT_URL: "${TELEGRAM_BOT_URL:-}"
      # MAX-бот (пусто = выключено): токен + ссылка для приглашений + операторы.
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_BOT_URL: "${MAX_BOT_URL:-}"
      MAX_ADMIN_IDS: "${MAX_ADMIN_IDS:-}"
      # Оплата ЮKassa (пусто = витрина показывает заглушку). Секреты — из .env.
      YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
      YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
      # Нейтральная страница «спасибо» с кнопками TG+VK (годится и для VK-only юзеров,
      # которых раньше редиректило на t.me — тупик без Telegram). Статика nginx.
      YOOKASSA_RETURN_URL: "${YOOKASSA_RETURN_URL:-https://tryberry.ru/spasibo/}"
      # Ставка НДС в чеке 54-ФЗ. Самозанятый (НПД) → 1 = «без НДС».
      YOOKASSA_VAT_CODE: "${YOOKASSA_VAT_CODE:-1}"
      # Робокасса (выбор провайдера через PAYMENT_PROVIDER=robokassa). Секреты — из .env.
      # Для теста: ROBOKASSA_IS_TEST=1 + тестовые пароли. SNO/NPD — формат чека НПД.
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-yookassa}"
      ROBOKASSA_MERCHANT_LOGIN: "${ROBOKASSA_MERCHANT_LOGIN:-}"
      ROBOKASSA_PASSWORD1: "${ROBOKASSA_PASSWORD1:-}"
      ROBOKASSA_PASSWORD2: "${ROBOKASSA_PASSWORD2:-}"
      ROBOKASSA_IS_TEST: "${ROBOKASSA_IS_TEST:-0}"
      ROBOKASSA_HASH_TYPE: "${ROBOKASSA_HASH_TYPE:-md5}"
      ROBOKASSA_SNO: "${ROBOKASSA_SNO:-npd}"
      ROBOKASSA_NPD: "${ROBOKASSA_NPD:-1}"
      # Рекуррент (подписка) — включать "1" только после активации менеджером Робокассы,
      # иначе ссылка подписки = ошибка 34. До этого в боте видна только разовая оплата.
      ROBOKASSA_RECURRING: "${ROBOKASSA_RECURRING:-0}"
      BILLING_CHARGE_INTERVAL_MINUTES: "${BILLING_CHARGE_INTERVAL_MINUTES:-60}"
      # Ozon: бот при /track скрейпит сразу → нужен тот же мобильный РФ-прокси,
      # что у scraper (tls-client ходит через него напрямую, мимо HTTPS_PROXY).
      OZON_PROXY_URL: "${OZON_PROXY_URL:-}"
      OZON_API_MODE: "${OZON_API_MODE:-mobile}"
      # browser-режим: тот же сайдкар-пул, что у scraper.
      OZON_BROWSER_URL: "${OZON_BROWSER_URL:-http://ozon-miner:8080}"
      # Путь B (аккаунт-токены): Ozon ходит под залогиненной аккаунт-сессией.
      # Секреты — в .env, в логи не пишутся (только cookie_len).
      OZON_ACCESS_TOKEN: "${OZON_ACCESS_TOKEN:-}"
      OZON_REFRESH_TOKEN: "${OZON_REFRESH_TOKEN:-}"
      # Готовая cookie-строка из приложения (HTTP Toolkit) — приоритетнее токенов.
      OZON_COOKIE: "${OZON_COOKIE:-}"
      # Я.Маркет: без аккаунта (цена публичная), хороший TLS + RU-прокси. Пусто →
      # код фолбэчит на OZON_PROXY_URL (тот же мобильный IP). Дележ IP ускоряет
      # его выгорание (см. OZON-STATUS) — при росте нагрузки задать отдельный.
      YANDEX_PROXY_URL: "${YANDEX_PROXY_URL:-}"
      # Прокси СРАЗУ, без пробного direct. Включать, когда датацентр-IP забанен
      # площадкой целиком: тогда direct — гарантированная капча и лишний запрос
      # на каждую карточку. Без YANDEX_PROXY_URL рубильник ничего не делает.
      YANDEX_PROXY_PRIMARY: "${YANDEX_PROXY_PRIMARY:-false}"
      # Брейкер по блокировкам (internal/scraper/breaker.go): N блокировок подряд
      # размыкают цепь площадки, дальше запросы давятся без обращения к сети, а
      # раз в COOLDOWN уходит одна проба. Так флаг на IP остывает, а не греется.
      # SCRAPE_BREAKER_BLOCKS=0 выключает предохранитель целиком.
      SCRAPE_BREAKER_BLOCKS: "${SCRAPE_BREAKER_BLOCKS:-10}"
      SCRAPE_BREAKER_COOLDOWN: "${SCRAPE_BREAKER_COOLDOWN:-5m}"
      SCRAPE_BREAKER_MAX_COOLDOWN: "${SCRAPE_BREAKER_MAX_COOLDOWN:-60m}"
      # AliExpress: бот при /track скрейпит сразу. Прокси нужен для рефреша cookie
      # (с датацентра cold-сессия = капча), дальше запросы напрямую. Пусто → фолбэк
      # на OZON_PROXY_URL (дележ IP жжёт его — при нагрузке задать отдельный).
      ALI_PROXY_URL: "${ALI_PROXY_URL:-}"
      # Ali-поиск по ссылке при /track: X5SEC режет direct-выдачу → фолбэк в
      # браузер-сайдкар ali-miner (как OZON_BROWSER_URL). Карточка идёт direct.
      ALI_BROWSER_URL: "${ALI_BROWSER_URL:-http://ali-miner:8082}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
      xray:
        condition: service_healthy
    labels:
      logging: "promtail"
      service: "bot-worker"

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: scraper
    # Без container_name — чтобы масштабировать в consumer-group (scrape-tasks =
    # 10 партиций). В prod ports сбрасываются оверлеем (!reset []), коллизии нет.
    # Реплики безопасны: consumer-group делит партиции, а partition.Manager
    # (партиции price_history) идемпотентен под advisory-lock.
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      DATABASE_URL: "postgres://tryberry_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "price-tracker"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      # Параллельная обработка scrape-задач в одном инстансе (скрейп I/O-bound,
      # CPU простаивал при последовательном консьюмере). Снимает главный потолок
      # пропускной без доп. реплик; per-MP RPS всё равно капится rate.Limiter.
      # 1 = прежний последовательный режим. docs/THROUGHPUT-ROADMAP.md №1.
      CONSUMER_CONCURRENCY: "${CONSUMER_CONCURRENCY:-8}"
      # Ozon вынесен в отдельный топик ozon-scrape-tasks (свой консюмер + группа),
      # чтобы медленные браузерные скрейпы не занимали слоты пула WB/YM.
      # docs/THROUGHPUT-ROADMAP.md №2.
      OZON_CONSUMER_CONCURRENCY: "${OZON_CONSUMER_CONCURRENCY:-6}"
      # Per-МП потолки RPS (НА РЕПЛИКУ; prod = 3 реплики → умножай на 3).
      # Это консервативные «потолки вежливости», не измеренные лимиты; поднимать
      # РЕАКТИВНО по сигналу lag/pending, сторожа — метрики капчи/403/not_found.
      # WB терпит сильно больше (basket-CDN, с cond-GET большинство ответов 304);
      # Ozon упирается в сайдкар (~1 rps на 4 дорожки) — поднимать вместе с
      # OZON_POOL_SIZE; Ali — осторожность X5SEC.
      SCRAPER_RATE_LIMIT_RPS_WB: "${SCRAPER_RATE_LIMIT_RPS_WB:-5}"
      SCRAPER_RATE_LIMIT_RPS_OZON: "${SCRAPER_RATE_LIMIT_RPS_OZON:-1}"
      # u-card (ЖИВАЯ цена WB) через xray: u-card 403-ит прямой RU-IP воркера,
      # зарубежный exit принимает. Пусто → идёт напрямую (403).
      WB_UCARD_PROXY_URL: "${WB_UCARD_PROXY_URL:-http://xray:8888}"
      # Цена WB — с живого u-card; архив basket-CDN только под историю/имя/картинку
      # (его последняя точка отстаёт на ДНИ и врала в 97% скрейпов при success rate
      # 100%). Нагрузка на xray ~4.2 запроса/мин — замер прода 2026-07-16.
      # РУБИЛЬНИК: WB_UCARD_PRIMARY=false в .env → прежний порядок «архив первый»
      # (цены снова отстанут, но бот переживёт падение xray / 403 от u-card).
      # Следить: wb_price_source{source="basket"} — рост доли = цены снова врут.
      WB_UCARD_PRIMARY: "${WB_UCARD_PRIMARY:-true}"
      # Мобильный РФ-прокси Ozon (путь B: аккаунт-сессия проходит FAB через
      # доверенный IP). Sticky/ротация 0. Секрет — в .env.
      OZON_PROXY_URL: "${OZON_PROXY_URL:-}"
      # Эндпоинт Ozon: mobile (composer-api.bx) | web (entrypoint-api.bx) |
      # browser (через сайдкар-пул ozon-miner — проходит FAB живой сессией).
      OZON_API_MODE: "${OZON_API_MODE:-mobile}"
      # browser-режим: URL сайдкара пула дорожек (см. сервис ozon-miner).
      OZON_BROWSER_URL: "${OZON_BROWSER_URL:-http://ozon-miner:8080}"
      # Путь B (аккаунт-токены) — секреты из .env, в логи не пишутся.
      OZON_ACCESS_TOKEN: "${OZON_ACCESS_TOKEN:-}"
      OZON_REFRESH_TOKEN: "${OZON_REFRESH_TOKEN:-}"
      # Готовая cookie-строка из приложения (HTTP Toolkit) — приоритетнее токенов.
      OZON_COOKIE: "${OZON_COOKIE:-}"
      SCRAPER_RATE_LIMIT_RPS_YANDEX: "${SCRAPER_RATE_LIMIT_RPS_YANDEX:-2}"
      # Я.Маркет: без аккаунта, хороший TLS + RU-прокси. Пусто → код фолбэчит на
      # OZON_PROXY_URL. При росте нагрузки задать отдельный (дележ IP жжёт его).
      YANDEX_PROXY_URL: "${YANDEX_PROXY_URL:-}"
      # Прокси СРАЗУ, без пробного direct. Включать, когда датацентр-IP забанен
      # площадкой целиком: тогда direct — гарантированная капча и лишний запрос
      # на каждую карточку. Без YANDEX_PROXY_URL рубильник ничего не делает.
      YANDEX_PROXY_PRIMARY: "${YANDEX_PROXY_PRIMARY:-false}"
      # Брейкер по блокировкам (internal/scraper/breaker.go): N блокировок подряд
      # размыкают цепь площадки, дальше запросы давятся без обращения к сети, а
      # раз в COOLDOWN уходит одна проба. Так флаг на IP остывает, а не греется.
      # SCRAPE_BREAKER_BLOCKS=0 выключает предохранитель целиком.
      SCRAPE_BREAKER_BLOCKS: "${SCRAPE_BREAKER_BLOCKS:-10}"
      SCRAPE_BREAKER_COOLDOWN: "${SCRAPE_BREAKER_COOLDOWN:-5m}"
      SCRAPE_BREAKER_MAX_COOLDOWN: "${SCRAPE_BREAKER_MAX_COOLDOWN:-60m}"
      SCRAPER_RATE_LIMIT_RPS_ALI: "${SCRAPER_RATE_LIMIT_RPS_ALI:-1}"
      # AliExpress: внутренний JSON-API (aer-jsonapi), без браузера. X5SEC решает
      # репутация IP → нужен RU-резидентский/мобильный прокси (датацентр = капча).
      # Пусто → фолбэк на OZON_PROXY_URL (дележ IP жжёт его — при нагрузке отдельный).
      ALI_PROXY_URL: "${ALI_PROXY_URL:-}"
      SCRAPER_HEALTH_PORT: "8090"
      OTLP_ENDPOINT: "jaeger:4317"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: "promtail"
      service: "scraper"

  # ── Поиск-воркер: обычная дорожка (search-tasks) ───────────────────────────
  search-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: search-worker
    container_name: pt_search_worker
    environment:
      DATABASE_URL: "postgres://tryberry_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "search-workers"
      SEARCH_TASKS_TOPIC: "search-tasks"
      # База u-search. Пусто → same-origin проксик www.wildberries.ru/__internal
      # (за wbaas, нужен cookie-токен). Публичный search.wb.ru отдаёт ту же
      # выдачу без токена и без браузера — рычаг на случай стены wbaas.
      WB_SEARCH_API_BASE: "${WB_SEARCH_API_BASE:-}"
      # Прокси HTTP-клиента WB/Ali-поиска (у перекуп-дорожки свой ключ ниже).
      # Пусто → direct. http://xray:8888 — рычаг, когда WB режет IP хоста.
      SEARCH_PROXY_URLS: "${SEARCH_PROXY_URLS:-}"
      # keep-alive к поисковому прокси. По умолчанию ВЫКЛЮЧЕН: за :8889 стоит
      # балансировщик «случайное плечо на соединение», и переиспользование
      # соединений приклеивает поиск к горстке адресов (разбор 01-09-2026).
      # "true" вернёт прежнее поведение, если поиск поедет мимо балансировщика.
      SEARCH_PROXY_KEEPALIVE: "${SEARCH_PROXY_KEEPALIVE:-false}"
      WB_TOKEN_POOL_PREFIX: "wb:search:"
      WB_TOKEN_POOL_SIZE: "5"
      # тот же WB-потолок, что у scraper (карточки в обогащении выдачи)
      SCRAPER_RATE_LIMIT_RPS_WB: "${SCRAPER_RATE_LIMIT_RPS_WB:-5}"
      # 403-фолбэк WB-поиска в браузер-сайдкар: wbaas режет ГОРЯЧИЕ запросы direct
      # (различие в транспорте, не в токене/IP). Горячие уходят в прогретый
      # браузер wb-search-miner (in-page fetch к тому же u-search).
      WB_SEARCH_BROWSER_URL: "${WB_SEARCH_BROWSER_URL:-http://wb-search-miner:8081}"
      SEARCH_SCRAPE_INTERVAL_MINUTES: "20"
      # Темп запросов к поисковой ручке WB: страниц на запрос × пауза между ними.
      # Крутилки вынесены в .env, потому что при 429 это единственный рычаг на
      # НАШЕЙ стороне (разброс по адресам и отключение keep-alive не помогли,
      # разбор 01-09-2026). Меньше страниц = уже выдача, больше пауза = дольше поиск.
      #
      # Три страницы (топ-300), а не пять: решение 01-09. Ниже третьей страницы
      # выдача WB вырождается в нерелевантное, а для подписки на выдачу важен
      # верх. Побочно это на 40% сокращает наши запросы к ручке.
      SEARCH_MAX_PAGES: "${SEARCH_MAX_PAGES:-3}"
      SEARCH_PAGE_DELAY_MS: "${SEARCH_PAGE_DELAY_MS:-700}"
      SEARCH_MAX_ITEMS_OZON: "${SEARCH_MAX_ITEMS_OZON:-72}"
      # Анти-спам below_target на широких/ротирующихся выдачах: не чаще раза в N мин.
      SEARCH_BELOW_TARGET_COOLDOWN_MINUTES: "${SEARCH_BELOW_TARGET_COOLDOWN_MINUTES:-360}"
      SEARCH_WORKER_HEALTH_PORT: "8094"
      OTLP_ENDPOINT: "jaeger:4317"
      # Я.Маркет-поиск ходит тем же tls-client + RU-прокси, что и карточный
      # scraper/bot-worker — иначе датацентровый IP ловит SmartCaptcha. Пусто →
      # код фолбэчит на OZON_PROXY_URL (см. cmd/search-worker/main.go).
      OZON_PROXY_URL: "${OZON_PROXY_URL:-}"
      YANDEX_PROXY_URL: "${YANDEX_PROXY_URL:-}"
      # Прокси СРАЗУ, без пробного direct. Включать, когда датацентр-IP забанен
      # площадкой целиком: тогда direct — гарантированная капча и лишний запрос
      # на каждую карточку. Без YANDEX_PROXY_URL рубильник ничего не делает.
      YANDEX_PROXY_PRIMARY: "${YANDEX_PROXY_PRIMARY:-false}"
      # Брейкер по блокировкам (internal/scraper/breaker.go): N блокировок подряд
      # размыкают цепь площадки, дальше запросы давятся без обращения к сети, а
      # раз в COOLDOWN уходит одна проба. Так флаг на IP остывает, а не греется.
      # SCRAPE_BREAKER_BLOCKS=0 выключает предохранитель целиком.
      SCRAPE_BREAKER_BLOCKS: "${SCRAPE_BREAKER_BLOCKS:-10}"
      SCRAPE_BREAKER_COOLDOWN: "${SCRAPE_BREAKER_COOLDOWN:-5m}"
      SCRAPE_BREAKER_MAX_COOLDOWN: "${SCRAPE_BREAKER_MAX_COOLDOWN:-60m}"
      # Ozon-поиск идёт ТОЛЬКО через сайдкар ozon-miner (browser-пул): прямой API
      # за FAB. /search дёргает выдачу из прогретой дорожки (searchResultsV2).
      OZON_BROWSER_URL: "${OZON_BROWSER_URL:-http://ozon-miner:8080}"
      # Ali-поиск: direct-POST /aer-webapi/v1/search, а на X5SEC-блок — фолбэк в
      # браузер-сайдкар ali-miner (карточка Ali проходит direct, выдачу режет).
      ALI_BROWSER_URL: "${ALI_BROWSER_URL:-http://ali-miner:8082}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: "promtail"
      service: "search-worker"

  # ── Поиск-воркер: дорожка перекупов (reseller-tasks) ───────────────────────
  # Масштабируется независимо: docker compose up -d --scale reseller-worker=N
  # (поэтому без container_name и без публикации портов). Партиций у топика
  # reseller-tasks хватает на 10 реплик (KAFKA_NUM_PARTITIONS). Отдельный пул
  # токенов (wb:reseller:) наполняет token-miner-reseller со своим egress.
  reseller-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: search-worker
    environment:
      DATABASE_URL: "postgres://tryberry_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "reseller-workers"
      SEARCH_TASKS_TOPIC: "reseller-tasks"
      # База u-search. Пусто → same-origin проксик www.wildberries.ru/__internal
      # (за wbaas, нужен cookie-токен). Публичный search.wb.ru отдаёт ту же
      # выдачу без токена и без браузера — рычаг на случай стены wbaas.
      WB_SEARCH_API_BASE: "${WB_SEARCH_API_BASE:-}"
      WB_TOKEN_POOL_PREFIX: "wb:reseller:"
      WB_TOKEN_POOL_SIZE: "5"
      # 403-фолбэк перекуп-дорожки в тот же браузер-сайдкар wb-search-miner.
      # См. WB_SEARCH_BROWSER_URL у search-worker.
      WB_SEARCH_BROWSER_URL: "${WB_SEARCH_BROWSER_URL:-http://wb-search-miner:8081}"
      SEARCH_SCRAPE_INTERVAL_MINUTES: "20"
      # Reseller — премиум-тариф: даём WB-поиску покрытие 3 стр (300) против 2 у
      # бесплатной дорожки. WB-каталог дёшев, поэтому +1 страница ничего не стоит.
      # См. комментарий у search-worker. У перекуп-дорожки свой темп: страниц
      # меньше, пауза короче — каданс раз в минуту.
      SEARCH_MAX_PAGES: "${RESELLER_SEARCH_MAX_PAGES:-3}"
      SEARCH_PAGE_DELAY_MS: "${RESELLER_SEARCH_PAGE_DELAY_MS:-400}"
      SEARCH_MAX_ITEMS_OZON: "${SEARCH_MAX_ITEMS_OZON:-72}"
      SEARCH_BELOW_TARGET_COOLDOWN_MINUTES: "${SEARCH_BELOW_TARGET_COOLDOWN_MINUTES:-360}"
      SEARCH_PROXY_URLS: "${RESELLER_SEARCH_PROXY_URLS:-}"
      # См. комментарий у search-worker.
      SEARCH_PROXY_KEEPALIVE: "${SEARCH_PROXY_KEEPALIVE:-false}"
      SEARCH_WORKER_HEALTH_PORT: "8094"
      OTLP_ENDPOINT: "jaeger:4317"
      # Я.Маркет-поиск на быстрых тарифах (interval ≤ resellerLaneCutoff)
      # попадает на ЭТУ дорожку — нужны те же RU-прокси, что у scraper, иначе
      # SmartCaptcha. Пусто → фолбэк на OZON_PROXY_URL (cmd/search-worker/main.go).
      OZON_PROXY_URL: "${OZON_PROXY_URL:-}"
      YANDEX_PROXY_URL: "${YANDEX_PROXY_URL:-}"
      # Прокси СРАЗУ, без пробного direct. Включать, когда датацентр-IP забанен
      # площадкой целиком: тогда direct — гарантированная капча и лишний запрос
      # на каждую карточку. Без YANDEX_PROXY_URL рубильник ничего не делает.
      YANDEX_PROXY_PRIMARY: "${YANDEX_PROXY_PRIMARY:-false}"
      # Брейкер по блокировкам (internal/scraper/breaker.go): N блокировок подряд
      # размыкают цепь площадки, дальше запросы давятся без обращения к сети, а
      # раз в COOLDOWN уходит одна проба. Так флаг на IP остывает, а не греется.
      # SCRAPE_BREAKER_BLOCKS=0 выключает предохранитель целиком.
      SCRAPE_BREAKER_BLOCKS: "${SCRAPE_BREAKER_BLOCKS:-10}"
      SCRAPE_BREAKER_COOLDOWN: "${SCRAPE_BREAKER_COOLDOWN:-5m}"
      SCRAPE_BREAKER_MAX_COOLDOWN: "${SCRAPE_BREAKER_MAX_COOLDOWN:-60m}"
      # Ozon-поиск на быстрых тарифах идёт ТОЖЕ сюда → нужен сайдкар ozon-miner
      # (browser-пул), как у search-worker. ВНИМАНИЕ: перекуп-каданс (≤1 мин) для
      # Ozon агрессивен для одной прогретой дорожки — следить за блокировками.
      OZON_BROWSER_URL: "${OZON_BROWSER_URL:-http://ozon-miner:8080}"
      # Ali-поиск на быстрых тарифах — тот же X5SEC-фолбэк в сайдкар ali-miner.
      ALI_BROWSER_URL: "${ALI_BROWSER_URL:-http://ali-miner:8082}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: "promtail"
      service: "reseller-worker"

  notifier:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notifier
    container_name: pt_notifier
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      DATABASE_URL: "postgres://tryberry_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "price-tracker"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      NOTIFIER_HEALTH_PORT: "8091"
      OTLP_ENDPOINT: "jaeger:4317"
      # Базовый публичный URL сайта — для кнопки «📈 График цены» в пушах (/p/).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://tryberry.ru}"
      # База для ссылок, которые бот КЛАДЁТ В СООБЩЕНИЯ пользователю (график
      # /p/<public_id>, оферта, политика). Отделена от PUBLIC_BASE_URL, который
      # остаётся каноническим адресом для SEO: если основной домен где-то
      # заблокирован (Safari на iOS показывает «Обманчивый сайт» по записи
      # Apple — docs/SAFE-BROWSING-APPEAL.md), ссылки пользователям можно
      # увести на рабочее зеркало, не трогая индексацию. Пусто → PUBLIC_BASE_URL.
      USER_LINK_BASE_URL: "${USER_LINK_BASE_URL:-}"
      # Egress к Telegram (уведомления) через xray (VLESS).
      # api.vk.com — мимо прокси: VK доступен напрямую.
      HTTPS_PROXY: "http://xray:8888"
      NO_PROXY: "postgres,redis,kafka,jaeger,localhost,127.0.0.1,api.vk.com,platform-api2.max.ru"
      # VK-доставка уведомлений (пусто = выключено, всё идёт в Telegram).
      VK_GROUP_TOKEN: "${VK_GROUP_TOKEN:-}"
      # MAX-доставка уведомлений (пусто = выключено).
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      # Еженедельный дайджест «хорошие цены сейчас». Выкл по умолчанию (шлёт всем
      # юзерам — включать осознанно). DIGEST_BATCH — юзеров на тик (раз в час).
      DIGEST_ENABLED: "${DIGEST_ENABLED:-false}"
      DIGEST_INTERVAL_DAYS: "${DIGEST_INTERVAL_DAYS:-7}"
      DIGEST_BATCH: "${DIGEST_BATCH:-100}"
      # Дневное окно рассылки (UTC) и период тика. Для теста «сейчас»: окно 0..24 +
      # тик 1 мин (увидишь свой дайджест в течение минуты), потом верни 6/18/60.
      DIGEST_HOUR_START: "${DIGEST_HOUR_START:-6}"
      DIGEST_HOUR_END: "${DIGEST_HOUR_END:-18}"
      DIGEST_TICK_MINUTES: "${DIGEST_TICK_MINUTES:-60}"
      # Канарейка: DIGEST_TEST_TG_IDS=<твой_tg_id> — слать дайджест ТОЛЬКО себе.
      # DIGEST_MIN_AGE_DAYS=0 — снять гейт достаточности (в коде 14 дней, см.
      # domain.honestMinAge): свежие товары попадут в дайджест. В проде не задавать.
      DIGEST_TEST_TG_IDS: "${DIGEST_TEST_TG_IDS:-}"
      DIGEST_MIN_AGE_DAYS: "${DIGEST_MIN_AGE_DAYS:--1}"
      # Нагрузочный тест (docs/LOAD-TEST-SYNTHETIC.md): алерты синтетических
      # юзеров редиректятся на тест-аккаунты (CSV chat_id). Пусто = синтетики
      # дропаются на доставке; на реальных юзеров не влияет никак.
      SYNTH_REDIRECT_TG_IDS: "${SYNTH_REDIRECT_TG_IDS:-}"
      SYNTH_REDIRECT_VK_IDS: "${SYNTH_REDIRECT_VK_IDS:-}"
      SYNTH_REDIRECT_MAX_IDS: "${SYNTH_REDIRECT_MAX_IDS:-}"
      SYNTH_REDIRECT_SAMPLE_N: "${SYNTH_REDIRECT_SAMPLE_N:-10}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
      xray:
        condition: service_healthy
    labels:
      logging: "promtail"
      service: "notifier"

  token-miner:
      build:
        context: ./token-miner
        dockerfile: Dockerfile
      container_name: pt_token_miner
      # Потолок памяти: простаивает ~106 МиБ, пик — браузер раз в MINE_INTERVAL_HOURS. Без него OOM был ГЛОБАЛЬНЫМ
      # (kill chrome 20-08-2026) и валил DNS/dockerd всему хосту.
      mem_limit: 1g
      init: true
      environment:
        REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
        WB_TOKEN_POOL_SIZE: "5"
        WB_SEARCH_QUERY: "телефон"
        # Как часто просыпается «ремонтник» пула и когда лезет за новым токеном.
        # Раньше здесь стоял MINE_INTERVAL_HOURS="12", которого код НЕ ЧИТАЕТ —
        # конфиг врал про поведение: майнер просыпается раз в 5 минут, а в браузер
        # идёт только за теми слотами, что пусты/broken/скоро протухнут.
        MINE_CHECK_INTERVAL_MINUTES: "${MINE_CHECK_INTERVAL_MINUTES:-5}"
        MINE_REFRESH_MARGIN_HOURS: "${MINE_REFRESH_MARGIN_HOURS:-24}"
        MINE_MAX_AGE_HOURS: "${MINE_MAX_AGE_HOURS:-48}"
        MINE_LOCK_TTL_MINUTES: "${MINE_LOCK_TTL_MINUTES:-30}"
        # Потолок паузы, когда минт не проходит цикл за циклом (стена wbaas), и
        # проверка живой cookie перед минтом — оба рычага против долбёжки стены.
        MINE_WALL_BACKOFF_MAX_MINUTES: "${MINE_WALL_BACKOFF_MAX_MINUTES:-60}"
        MINE_REVALIDATE: "${MINE_REVALIDATE:-true}"
        WB_TOKEN_POOL_PREFIX: "${WB_TOKEN_POOL_PREFIX:-wb:search:}"
        MINE_RETRY_MINUTES: "10"
        MINE_MAX_RELOADS: "2"
        MINE_TIMEOUT_SECONDS: "150"
        # Прокси для майнинга WB-токенов — опциональный фолбэк из .env. С 2026-07-03
        # минтим DIRECT с датацентр-IP (проверено: 5/5 слотов без челленджа),
        # мобильный прокси отменён; переменная остаётся пустой.
        WB_TOKEN_PROXY_URL: "${WB_TOKEN_PROXY_URL:-}"
        # Общий лок майнинга: обычный и reseller-майнер делят один exit-IP (direct
        # с VPS) — один ключ не даёт им майнить одновременно (всплеск минтов палит WB).
        MINE_GLOBAL_LOCK: "wb:mine:lock"
        HEADLESS: "false"
        LOG_LEVEL: "INFO"
      shm_size: "1gb"
      depends_on:
        redis:
          condition: service_healthy
      labels:
        logging: "promtail"
        service: "token-miner"

  # ── Майнер пула токенов перекупов (wb:reseller:) ───────────────────────────
  # Отдельный пул токенов; egress сейчас direct (RESELLER_TOKEN_PROXY_URL пуст,
  # прокси остался как опция на случай блоков). Размер пула должен совпадать
  # с WB_TOKEN_POOL_SIZE у reseller-worker; при сокращении удалить хвостовые
  # слоты wb:reseller:pool:{i} из Redis — Go-пул не проверяет exp.
  token-miner-reseller:
      build:
        context: ./token-miner
        dockerfile: Dockerfile
      container_name: pt_token_miner_reseller
      # Потолок памяти: то же, что token-miner. Без него OOM был ГЛОБАЛЬНЫМ
      # (kill chrome 20-08-2026) и валил DNS/dockerd всему хосту.
      mem_limit: 1g
      init: true
      environment:
        REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
        WB_TOKEN_POOL_PREFIX: "wb:reseller:"
        MINE_REFRESH_MARGIN_HOURS: "${MINE_REFRESH_MARGIN_HOURS:-24}"
        MINE_MAX_AGE_HOURS: "${MINE_MAX_AGE_HOURS:-48}"
        MINE_LOCK_TTL_MINUTES: "${MINE_LOCK_TTL_MINUTES:-30}"
        MINE_WALL_BACKOFF_MAX_MINUTES: "${MINE_WALL_BACKOFF_MAX_MINUTES:-60}"
        MINE_REVALIDATE: "${MINE_REVALIDATE:-true}"
        WB_DISABLE_LEGACY_MIRROR: "true"
        WB_TOKEN_POOL_SIZE: "5"
        WB_SEARCH_QUERY: "телефон"
        # У перекупов свой каданс (3 мин против 5): пул нужен горячим чаще.
        MINE_CHECK_INTERVAL_MINUTES: "${RESELLER_MINE_CHECK_INTERVAL_MINUTES:-3}"
        MINE_RETRY_MINUTES: "5"
        MINE_MAX_RELOADS: "2"
        MINE_TIMEOUT_SECONDS: "150"
        WB_TOKEN_PROXY_URL: "${RESELLER_TOKEN_PROXY_URL:-}"
        # Тот же лок, что у обычного майнера → не майнят одновременно с общего IP.
        MINE_GLOBAL_LOCK: "wb:mine:lock"
        HEADLESS: "false"
        LOG_LEVEL: "INFO"
      shm_size: "1gb"
      depends_on:
        redis:
          condition: service_healthy
      labels:
        logging: "promtail"
        service: "token-miner-reseller"

  # ── Ozon miner: браузер-как-транспорт, пул дорожек ─────────────────────────
  # Долгоживущий сервис: на каждую дорожку — отдельный браузер camoufox
  # (анти-детект Firefox, НЕ Chromium: голый Chromium на FAB палился). Дорожки
  # по умолчанию АНОНИМНЫЕ — camoufox проходит FAB без логина; аккаунт-cookie
  # нужен ТОЛЬКО под товары 18+ (возрастной гейт), такая дорожка помечается
  # authed и резервируется под 18+, чтобы не гонять аккаунт по массовому потоку.
  # Цена достаётся in-page fetch к entrypoint-api изнутри доверенного контекста.
  # Go-скрейпер (OZON_API_MODE=browser, OZON_BROWSER_URL) зовёт GET /scrape?id=…
  # по внутренней сети — портов наружу нет.
  # Масштабирование: поднять OZON_POOL_SIZE; OZON_LANE_<i>_PROXY/_COOKIE
  # опциональны (пусто → дорожка идёт direct с IP сервера и без логина, это
  # штатный режим; 8 дорожек с одного IP проходят FAB — замер 2026-07-20).
  # Память определяется АПТАЙМОМ, а не числом дорожек: ~5 ГиБ на плато.
  ozon-miner:
      build:
        context: ./ozon-miner
        dockerfile: Dockerfile
      container_name: pt_ozon_miner
      # Потолок памяти: ~5 ГиБ на плато (см. выше), потолок с запасом на пик. Без него OOM был ГЛОБАЛЬНЫМ
      # (kill chrome 20-08-2026) и валил DNS/dockerd всему хосту.
      mem_limit: 6g
      init: true
      environment:
        OZON_MINER_PORT: "8080"
        OZON_POOL_SIZE: "${OZON_POOL_SIZE:-1}"
        # Дорожка 0 (legacy-фолбэк). Доп. дорожки — OZON_LANE_1_PROXY/_COOKIE и т.д.
        OZON_PROXY_URL: "${OZON_PROXY_URL:-}"
        OZON_COOKIE: "${OZON_COOKIE:-}"
        # Дорожки 1..7: без этих строк переменная из .env до контейнера НЕ доедет
        # (на проде уже гоняли OZON_POOL_SIZE=8, а проброшены были только 1-2).
        # Пусто → дорожка идёт direct с IP сервера, это штатный режим.
        OZON_LANE_1_PROXY: "${OZON_LANE_1_PROXY:-}"
        OZON_LANE_1_COOKIE: "${OZON_LANE_1_COOKIE:-}"
        OZON_LANE_2_PROXY: "${OZON_LANE_2_PROXY:-}"
        OZON_LANE_2_COOKIE: "${OZON_LANE_2_COOKIE:-}"
        OZON_LANE_3_PROXY: "${OZON_LANE_3_PROXY:-}"
        OZON_LANE_3_COOKIE: "${OZON_LANE_3_COOKIE:-}"
        OZON_LANE_4_PROXY: "${OZON_LANE_4_PROXY:-}"
        OZON_LANE_4_COOKIE: "${OZON_LANE_4_COOKIE:-}"
        OZON_LANE_5_PROXY: "${OZON_LANE_5_PROXY:-}"
        OZON_LANE_5_COOKIE: "${OZON_LANE_5_COOKIE:-}"
        OZON_LANE_6_PROXY: "${OZON_LANE_6_PROXY:-}"
        OZON_LANE_6_COOKIE: "${OZON_LANE_6_COOKIE:-}"
        OZON_LANE_7_PROXY: "${OZON_LANE_7_PROXY:-}"
        OZON_LANE_7_COOKIE: "${OZON_LANE_7_COOKIE:-}"
        # Человекоподобный интервал между запросами одной дорожки + джиттер.
        OZON_LANE_MIN_INTERVAL_MS: "${OZON_LANE_MIN_INTERVAL_MS:-1500}"
        OZON_LANE_JITTER: "${OZON_LANE_JITTER:-0.4}"
        # Периодический re-warm живой сессии (рефреш токена/доверия), мин.
        OZON_WARM_KEEPALIVE_MINUTES: "${OZON_WARM_KEEPALIVE_MINUTES:-45}"
        # Плановый recycle браузера по возрасту. Введён 02-09-2026: зажившийся
        # camoufox перестаёт проходить FAB (за 5 суток аптайма 5 дорожек из 6 не
        # могли прогреться, пул тихо деградировал до одной, p95 скрейпа 26-29с),
        # а пересоздание вернуло 6/6. Джиттер разводит дорожки, чтобы пул не
        # уходил на прогрев разом. 0 — выключить.
        OZON_LANE_MAX_AGE_SECONDS: "${OZON_LANE_MAX_AGE_SECONDS:-21600}"
        OZON_LANE_MAX_AGE_JITTER: "${OZON_LANE_MAX_AGE_JITTER:-0.2}"
        # Рычаги на инцидент (значения = дефолты кода). OZON_LANE_STUCK_SECONDS
        # сюда НЕ выносим: его дефолт вычисляется из таймаутов операций, и
        # фиксация числом заморозила бы связь между ними.
        OZON_WARM_BACKOFF_MAX_SECONDS: "${OZON_WARM_BACKOFF_MAX_SECONDS:-600}"
        OZON_WARM_WAIT_SECONDS: "${OZON_WARM_WAIT_SECONDS:-45}"
        OZON_SCRAPE_RETRIES: "${OZON_SCRAPE_RETRIES:-2}"
        OZON_SCRAPE_TIMEOUT_SECONDS: "${OZON_SCRAPE_TIMEOUT_SECONDS:-12}"
        OZON_NAV_TIMEOUT_SECONDS: "${OZON_NAV_TIMEOUT_SECONDS:-60}"
        OZON_HEALTH_INTERVAL_SECONDS: "${OZON_HEALTH_INTERVAL_SECONDS:-30}"
        # Ротация IP: switch-ссылка провайдера + период (мин, 0=выкл). Частую
        # можно, но каждая ротация = пере-прогрев (заново FAB на новом IP).
        OZON_PROXY_ROTATE_URL: "${OZON_PROXY_ROTATE_URL:-}"
        OZON_ROTATE_INTERVAL_MINUTES: "${OZON_ROTATE_INTERVAL_MINUTES:-0}"
        HEADLESS: "false"
        LOG_LEVEL: "INFO"
      shm_size: "1gb"
      labels:
        logging: "promtail"
        service: "ozon-miner"

  # ── WB search miner: браузер-как-транспорт для горячих запросов ─────────────
  # Долгоживущий сервис: прогретые дорожки (headful Chromium/patchright в Xvfb)
  # проходят wbaas-стену и отдают выдачу u-search in-page fetch'ем. Go-воркеры
  # (search-worker/reseller-worker) зовут GET /search как 403-фолбэк по
  # внутренней сети (WB_SEARCH_BROWSER_URL) — портов наружу нет. Прокси не нужен
  # (direct с датацентр-IP в браузере проходит, как у token-miner).
  wb-search-miner:
      build:
        context: ./wb-search-miner
        dockerfile: Dockerfile
      container_name: pt_wb_search_miner
      # Потолок памяти: штатно ~1 ГиБ. Без него OOM был ГЛОБАЛЬНЫМ
      # Потолок памяти. 3 ГиБ, а не 2 (поднято 25-08): chrome в ali течёт со
      # скоростью ~2 ГиБ за 25 минут, и при потолке 2 ГиБ плановый recycle на
      # 20-й минуте заставал браузер уже ПОД потолком — любой всплеск на
      # загрузке страницы опрокидывал его раньше, чем замена завершится. Потолок
      # превратился в рабочую точку вместо страховки: OOM каждые ~47 минут
      # сутки подряд. С 3 ГиБ recycle успевает задолго до предела, а лимит
      # снова делает то, ради чего вводился после глобального OOM 20-08, —
      # держит течь внутри контейнера, а не спасает хост ценой убийства процесса.
      mem_limit: 3g
      init: true
      environment:
        WB_SEARCH_MINER_PORT: "8081"
        WB_SEARCH_POOL_SIZE: "${WB_SEARCH_POOL_SIZE:-1}"
        # Прогрев ХОЛОДНЫМ запросом: горячий («телефон») сам провоцирует
        # эскалацию wbaas до document-стены. См. WB-SEARCH-STATUS.md.
        WB_WARM_QUERY: "${WB_WARM_QUERY:-капибара}"
        # Потолок backoff под стеной, сек (деф. 1800 — не подогревать IP ретраями)
        # и порог «стена стоит»: дальше прогрев одной навигацией + краткий лог.
        WB_WARM_BACKOFF_MAX_SECONDS: "${WB_WARM_BACKOFF_MAX_SECONDS:-1800}"
        WB_WALLED_AFTER: "${WB_WALLED_AFTER:-2}"
        # Опц. прокси дорожек (обычно НЕ нужен — direct проходит).
        WB_SEARCH_PROXY_URL: "${WB_SEARCH_PROXY_URL:-}"
        WB_LANE_1_PROXY: "${WB_LANE_1_PROXY:-}"
        # Человекоподобный интервал запросов одной дорожки + джиттер.
        WB_LANE_MIN_INTERVAL_MS: "${WB_LANE_MIN_INTERVAL_MS:-800}"
        WB_LANE_JITTER: "${WB_LANE_JITTER:-0.4}"
        # Периодический re-warm живой дорожки (рефреш токена/доверия), мин.
        WB_WARM_KEEPALIVE_MINUTES: "${WB_WARM_KEEPALIVE_MINUTES:-30}"
        # После N неудачных прогревов подряд — пересоздать браузер (свежий
        # фингерпринт против залипания на document-498). 0 — не пересоздавать.
        WB_WARM_RELAUNCH_AFTER: "${WB_WARM_RELAUNCH_AFTER:-3}"
        # Рычаги на инцидент: путь u-search (менялся 24-08), длительность и число
        # прогревов, ретраи/таймаут запроса, пороги вотчдога. Значения = дефолты
        # кода, поведение не меняется — меняется лишь возможность их покрутить.
        WB_USEARCH_PATH: "${WB_USEARCH_PATH:-/__internal/u-search/exactmatch/ru/common/v18/search}"
        WB_WARM_WAIT_SECONDS: "${WB_WARM_WAIT_SECONDS:-150}"
        WB_WARM_RELOADS: "${WB_WARM_RELOADS:-2}"
        WB_FETCH_RETRIES: "${WB_FETCH_RETRIES:-2}"
        WB_FETCH_TIMEOUT_SECONDS: "${WB_FETCH_TIMEOUT_SECONDS:-15}"
        WB_NAV_TIMEOUT_SECONDS: "${WB_NAV_TIMEOUT_SECONDS:-60}"
        WB_LANE_STUCK_SECONDS: "${WB_LANE_STUCK_SECONDS:-180}"
        WB_HEALTH_INTERVAL_SECONDS: "${WB_HEALTH_INTERVAL_SECONDS:-30}"
        WB_LANE_MAX_AGE_JITTER: "${WB_LANE_MAX_AGE_JITTER:-0.2}"
        # Плановый recycle по возрасту браузера. По умолчанию ВЫКЛЮЧЕН (0):
        # каждое пересоздание здесь — новый проход wbaas, то есть провокация,
        # а растёт wb-медленнее ali (1.4 ГиБ за 19ч против 2 ГиБ за 47 мин).
        # Ключ проброшен, чтобы рычаг был под рукой, если упрётся в свои 2g.
        WB_LANE_MAX_AGE_SECONDS: "${WB_LANE_MAX_AGE_SECONDS:-0}"
        HEADLESS: "false"
        LOG_LEVEL: "INFO"
      shm_size: "1gb"
      labels:
        logging: "promtail"
        service: "wb-search-miner"

  # ── Ali miner: браузер-как-транспорт для поисковой выдачи aliexpress.ru ──────
  # Долгоживущий сервис: прогретые дорожки (headful Chromium/patchright в Xvfb)
  # проходят X5SEC и отдают выдачу /aer-webapi/v1/search перехватом нативного
  # XHR. Go-воркеры (search/reseller/bot) зовут GET /search как фолбэк на
  # X5SEC-блок direct-выдачи (ALI_BROWSER_URL) по внутренней сети — портов
  # наружу нет. Прокси не нужен (карточная дорожка доказала: X5SEC пускает
  # датацентр-IP при живой сессии).
  ali-miner:
      build:
        context: ./ali-miner
        dockerfile: Dockerfile
      container_name: pt_ali_miner
      # Потолок памяти. 3 ГиБ, а не 2 (поднято 25-08). Chrome здесь течёт со
      # скоростью ~2 ГиБ за 25 минут (20-08 дорос до 6.7 ГиБ и уронил хост).
      # При потолке 2 ГиБ плановый recycle на 20-й минуте заставал браузер уже
      # ПОД потолком, и всплеск на загрузке страницы опрокидывал его раньше,
      # чем замена завершится: OOM каждые ~47 минут сутки подряд. Потолок стал
      # рабочей точкой вместо страховки. С 3 ГиБ recycle успевает задолго до
      # предела, а лимит снова делает то, ради чего вводился, — держит течь
      # внутри контейнера, не спасая хост ценой убийства процесса.
      mem_limit: 3g
      init: true
      environment:
        ALI_MINER_PORT: "8082"
        ALI_SEARCH_POOL_SIZE: "${ALI_SEARCH_POOL_SIZE:-1}"
        ALI_WARM_QUERY: "${ALI_WARM_QUERY:-телефон}"
        # Опц. прокси дорожек (обычно НЕ нужен — direct проходит).
        ALI_SEARCH_PROXY_URL: "${ALI_SEARCH_PROXY_URL:-}"
        ALI_LANE_1_PROXY: "${ALI_LANE_1_PROXY:-}"
        # Человекоподобный интервал запросов одной дорожки + джиттер.
        ALI_LANE_MIN_INTERVAL_MS: "${ALI_LANE_MIN_INTERVAL_MS:-1500}"
        ALI_LANE_JITTER: "${ALI_LANE_JITTER:-0.4}"
        # Периодический re-warm живой дорожки (рефреш доверия сессии), мин.
        ALI_WARM_KEEPALIVE_MINUTES: "${ALI_WARM_KEEPALIVE_MINUTES:-30}"
        # После N неудачных прогревов подряд — пересоздать браузер (свежий
        # фингерпринт против залипания на walled-контексте). 0 — не пересоздавать.
        ALI_WARM_RELAUNCH_AFTER: "${ALI_WARM_RELAUNCH_AFTER:-3}"
        # Плановое пересоздание браузера по возрасту. Дефолт кода (6ч) для ali
        # бесполезен: его chrome течёт и добирается до mem_limit 2g примерно за
        # 47 минут, так что раньше recycle приходил OOM-killer (ночь 24→25-08,
        # 15 срабатываний подряд с этим самым ритмом). 30 мин + джиттер = штатный
        # перезапуск успевает первым, а это на порядок мягче убийства процесса
        # посреди запроса. Течь это не лечит — лечит предсказуемость.
        # Плановое пересоздание браузера по возрасту — теперь обычная гигиена,
        # а не аварийная мера. Причину роста устранили парковкой вкладки
        # (ALI_PARK_PAGE): с ней расход держится ровно на ~520 МиБ. Аварийные
        # 10 минут снимаем — каждое пересоздание это лишний проход X5SEC.
        ALI_LANE_MAX_AGE_SECONDS: "${ALI_LANE_MAX_AGE_SECONDS:-3600}"
        ALI_LANE_MAX_AGE_JITTER: "${ALI_LANE_MAX_AGE_JITTER:-0.2}"
        # Пауза между закрытием старого браузера и запуском нового: ждём, пока
        # cgroup реально отдаст память (browser.close() лишь просит chrome
        # завершиться). Без неё новый браузер стартовал поверх умирающего.
        # Гасить вкладку (about:blank) после прогрева и после каждого запроса:
        # выдача aliexpress.ru раздувает рендерер до 3 ГиБ за ~20 секунд и живёт
        # так сама по себе. Рубильник на случай, если антибот смотрит на живую
        # вкладку — тогда ALI_PARK_PAGE=false вернёт прежнее поведение.
        ALI_PARK_PAGE: "${ALI_PARK_PAGE:-true}"
        ALI_PARK_TIMEOUT_SECONDS: "${ALI_PARK_TIMEOUT_SECONDS:-10}"
        ALI_RELAUNCH_SETTLE_SECONDS: "${ALI_RELAUNCH_SETTLE_SECONDS:-15}"
        ALI_RELAUNCH_SETTLE_FRACTION: "${ALI_RELAUNCH_SETTLE_FRACTION:-0.5}"
        # Те же рычаги, что у wb-сайдкара. Значения = дефолты кода.
        ALI_WARM_BACKOFF_MAX_SECONDS: "${ALI_WARM_BACKOFF_MAX_SECONDS:-600}"
        ALI_WARM_WAIT_SECONDS: "${ALI_WARM_WAIT_SECONDS:-150}"
        ALI_WARM_RELOADS: "${ALI_WARM_RELOADS:-2}"
        ALI_FETCH_TIMEOUT_SECONDS: "${ALI_FETCH_TIMEOUT_SECONDS:-20}"
        ALI_NAV_TIMEOUT_SECONDS: "${ALI_NAV_TIMEOUT_SECONDS:-60}"
        ALI_LANE_STUCK_SECONDS: "${ALI_LANE_STUCK_SECONDS:-180}"
        ALI_HEALTH_INTERVAL_SECONDS: "${ALI_HEALTH_INTERVAL_SECONDS:-30}"
        HEADLESS: "false"
        LOG_LEVEL: "INFO"
      shm_size: "1gb"
      labels:
        logging: "promtail"
        service: "ali-miner"

  scheduler:
      build:
        context: .
        dockerfile: Dockerfile
        args:
          SERVICE: scheduler
      container_name: pt_scheduler
      environment:
        DATABASE_URL: "postgres://tryberry_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}@postgres:5432/tryberrybot?sslmode=disable"
        KAFKA_BROKERS: "kafka:29092"
        SCRAPE_INTERVAL_MINUTES: "15"
        # Опциональный аварийный троттл Ozon-товаров (пол интервала + множитель к
        # тарифу). В проде ВЫКЛЮЧЕН (.env: 0 и 1) — Ozon идёт полным тарифным
        # кадансом как WB/YM (reseller = 1 мин), сайдкар ozon-miner держит нагрузку.
        # Ставить >0/>1 только если сайдкар начнёт захлёбываться. docs/SCRAPE-CADENCE.md.
        OZON_MIN_INTERVAL_MINUTES: "${OZON_MIN_INTERVAL_MINUTES:-0}"
        OZON_INTERVAL_MULTIPLIER: "${OZON_INTERVAL_MULTIPLIER:-1}"
        # Пол интервала Ozon-ПОИСКА (выдача ротируется, одна прогретая дорожка):
        # не чаще этого даже на быстрых тарифах → уводит Ozon с reseller-дорожки.
        OZON_SEARCH_MIN_INTERVAL_MINUTES: "${OZON_SEARCH_MIN_INTERVAL_MINUTES:-30}"
        # Разброс вокруг пола (0.4 → ±40%): без него запрос ходит по ровной сетке.
        OZON_SEARCH_JITTER: "${OZON_SEARCH_JITTER:-0.4}"
        SCHEDULER_TICK_SECONDS: "20"
        SCHEDULER_HEALTH_PORT: "8092"
        OTLP_ENDPOINT: "jaeger:4317"
      depends_on:
        postgres:
          condition: service_healthy
        kafka:
          condition: service_healthy
        jaeger:
          condition: service_started
      labels:
        logging: "promtail"
        service: "scheduler"

  postgres:
    image: postgres:16
    container_name: pt_postgres
    # Тюнинг под сервер 8 CPU / 16 ГБ RAM / NVMe (дефолты PG рассчитаны на
    # машину прошлого века: shared_buffers=128MB и т.п.). PG здесь не один —
    # рядом Kafka и два Chromium-майнера, поэтому берём умеренные ~25% RAM.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
    shm_size: 1gb
    environment:
      POSTGRES_DB: tryberrybot
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tryberrybot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pt_redis
    # Потолок памяти, чтобы Redis не разрастался бесконтрольно. Политика
    # volatile-lru: вытесняются ТОЛЬКО ключи с TTL (FSM, коды привязки,
    # price-cache) — пулы WB-токенов без TTL не трогаются.
    # AOF + volume: пулы WB-токенов и FSM переживают пересоздание контейнера.
    # Без этого каждый recreate redis стирал пулы → полный перемайн через
    # резидентный прокси (основной источник расхода трафика lteboost).
    command:
      - redis-server
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # Хардинг после инцидента 2026-07-03 (rogue-replica attack): отключаем
      # репликацию и загрузку модулей — мы их не используем, а это ровно векторы
      # атаки (REPLICAOF на чужой мастер + MODULE LOAD = RCE). Defense-in-depth
      # поверх закрытых портов.
      - --rename-command
      - REPLICAOF
      - ""
      - --rename-command
      - SLAVEOF
      - ""
      - --rename-command
      - MODULE
      - ""
      # Ещё векторы, которые код не использует: массовое удаление и отладка.
      # CONFIG оставлен — его дёргает redis-exporter (maxmemory-метрики).
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - DEBUG
      - ""
      # Пароль (defense-in-depth поверх закрытого порта): даже если порт снова
      # окажется опубликован или атакующий попадёт в docker-сеть — без пароля
      # Redis нем. Клиенты берут его из REDIS_URL (redis://:pass@redis:6379).
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
    environment:
      # redis-cli в healthcheck авторизуется через этот env (не светится в ps).
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pt_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pt_kafka
    depends_on: [zookeeper]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # ВНУТРЕННИЙ listener для общения между контейнерами (kafka-exporter, etc)
      # ВНЕШНИЙ listener для подключения с хоста (наши Go-сервисы)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Транзакции (exactly_once_v2 в price-insight). Дефолты рассчитаны на
      # кластер: RF=3 и min.isr=2, а брокер у нас ОДИН — служебный топик
      # __transaction_state с такими требованиями не создаётся, и клиент вечно
      # висит на InitProducerId («Timeout initializing transactions»), молча не
      # обрабатывая ничего. На Go-сервисы не влияет: транзакции использует только
      # price-insight, а сам топик до него не существовал.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 10
      # События транзитные (апдейты, цены, поисковые хиты) — 3 суток с запасом
      # на любой даунтайм консьюмеров; дефолтные 7 дней просто жгли диск.
      KAFKA_LOG_RETENTION_HOURS: 72
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── Observability ─────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pt_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 180 ГБ NVMe позволяют хранить больше истории; на всякий случай ещё и
      # потолок по размеру (срабатывает то, что наступит раньше).
      - '--storage.tsdb.retention.time=60d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'  # позволяет reload конфига без рестарта
    # Linux — нужен extra_hosts чтобы достучаться до хоста
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.2.0
    container_name: pt_loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'

  promtail:
    image: grafana/promtail:3.2.0
    container_name: pt_promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-config.file=/etc/promtail/config.yml'
    depends_on:
      - loki

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pt_postgres_exporter
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      # Отдельная роль только с pg_monitor (см. scripts/pg-create-roles.sh) —
      # экспортеру не нужен суперюзер, а его DSN — лишняя копия админ-пароля.
      DATA_SOURCE_NAME: "postgresql://tryberry_monitor:${MONITOR_DB_PASSWORD:?MONITOR_DB_PASSWORD must be set in .env}@postgres:5432/tryberrybot?sslmode=disable"
      # Кастомные security-метрики: число суперюзеров/ролей (алерт на бэкдор
      # вроде pgg_superadmins из инцидента 2026-07-03).
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres-exporter/queries.yaml"
    volumes:
      - ./monitoring/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: pt_redis_exporter
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      # Пароль Redis (requirepass) — exporter читает его из env.
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command:
      - '--redis.addr=redis://redis:6379'
      - '--check-single-keys=wb:search:token:mined_at,wb:search:token:exp,wb:search:pool:healthy,wb:search:pool:oldest_mined_at,wb:search:pool:mined_total,wb:search:pool:mine_failed_total,wb:reseller:pool:healthy,wb:reseller:pool:oldest_mined_at,wb:reseller:pool:mined_total,wb:reseller:pool:mine_failed_total'
    depends_on:
      redis:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: pt_kafka_exporter
    ports:
      - "127.0.0.1:9308:9308"
    command:
      - '--kafka.server=kafka:29092'
    depends_on:
      kafka:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pt_alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager:/config:ro
      - alertmanager_data:/alertmanager
    environment:
      TELEGRAM_ALERT_BOT_TOKEN: "${TELEGRAM_ALERT_BOT_TOKEN}"
      TELEGRAM_ALERT_CHAT_ID: "${TELEGRAM_ALERT_CHAT_ID}"
    user: root
    entrypoint: [ "/bin/sh", "/config/entrypoint.sh" ]


  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pt_jaeger
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC (куда сервисы шлют спаны)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Хранение в памяти — для пет-проекта норм
      SPAN_STORAGE_TYPE: "memory"
      # Лимит спанов в памяти, дальше старые вытесняются
      MEMORY_MAX_TRACES: "50000"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pt_grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Safe-by-default после инцидента 2026-07-03: деплой без прод-оверрайда
      # оставлял admin/admin + анонимный доступ на открытом :3000. Теперь и в
      # базовом файле пароль из .env, анонимный доступ выключен (в dev при
      # желании включить локально: GF_AUTH_ANONYMOUS_ENABLED=true).
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "${GF_AUTH_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
      - loki
      - jaeger

#  node-exporter:
#    image: prom/node-exporter:v1.8.2
#    container_name: pt_node_exporter
#    ports:
#      - "9100:9100"
#    command:
#      - '--path.rootfs=/host'
#    volumes:
#      - /:/host:ro,rslave
#    pid: host

  # ── price-insight (JVM) ────────────────────────────────────────────────────
  # Единственный сервис на JVM. Держит по товару сегментное состояние цены и
  # материализует вердикт «честной цены», снимая time-weighted агрегацию с
  # горячего пути notifier. Обоснование выбора стека, границы и отвергнутые
  # альтернативы — docs/PRICE-INSIGHT-JAVA.md.
  #
  # Лимит памяти выставлен явно (у остальных сервисов его нет): Kafka Streams
  # держит block cache RocksDB вне heap, и без потолка процесс может незаметно
  # разрастись и утянуть за собой соседей по хосту.
  price-insight:
    build:
      context: ./price-insight
      dockerfile: Dockerfile
    container_name: pt_price_insight
    mem_limit: 1g
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      KAFKA_BROKERS: "kafka:29092"
      POSTGRES_DSN: "jdbc:postgresql://postgres:5432/tryberrybot"
      POSTGRES_USER: "tryberry_app"
      POSTGRES_PASSWORD: "${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}"
      STATE_DIR: "/var/lib/price-insight"
      SERVER_PORT: "8092"
    volumes:
      - price_insight_state:/var/lib/price-insight
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/actuator/health/readiness | grep -q UP"]
      interval: 30s
      timeout: 5s
      # start_period большой намеренно: при первом запуске сервис прожёвывает
      # всю историю price-events и до этого readiness честно красный.
      start_period: 300s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy


volumes:
  price_insight_state:
  pgdata:
  redis_data:
  prometheus_data:
  loki_data:
  alertmanager_data:
  grafana_data:
