
services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api
    container_name: pt_api
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "price-tracker"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL}"
      WEBHOOK_ENABLED: "${WEBHOOK_ENABLED:-false}"
      OTLP_ENDPOINT: "jaeger:4317"
      PORT: "8081"
      ADMIN_IDS: "${ADMIN_IDS}"
      SCRAPE_INTERVAL_MINUTES: "10"
      HTTPS_PROXY: "${TELEGRAM_PROXY_URL}"
      TELEGRAM_POLL_TIMEOUT_SECONDS: "${TELEGRAM_POLL_TIMEOUT_SECONDS:-1}"
      NO_PROXY: "postgres,redis,kafka,jaeger,localhost,127.0.0.1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      # Лейблы для Promtail — он по ним группирует логи в Loki
      logging: "promtail"
      service: "api"

  bot-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: bot-worker
    container_name: pt_bot_worker
    environment:
      DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "bot-workers"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      BOT_WORKER_HEALTH_PORT: "8093"
      OTLP_ENDPOINT: "jaeger:4317"
      HTTPS_PROXY: "${TELEGRAM_PROXY_URL}"
      NO_PROXY: "postgres,redis,kafka,jaeger,localhost,127.0.0.1"
      ADMIN_IDS: "${ADMIN_IDS}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: "promtail"
      service: "bot-worker"

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: scraper
    container_name: pt_scraper
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "price-tracker"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      WB_TOKEN_POOL_SIZE: "5"
      SCRAPER_RATE_LIMIT_RPS: "5"
      SCRAPER_HEALTH_PORT: "8090"
      SEARCH_SCRAPE_INTERVAL_MINUTES: "20"
      OTLP_ENDPOINT: "jaeger:4317"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: "promtail"
      service: "scraper"

  notifier:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notifier
    container_name: pt_notifier
    ports:
      - "8091:8091"
    environment:
      DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "price-tracker"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      NOTIFIER_HEALTH_PORT: "8091"
      OTLP_ENDPOINT: "jaeger:4317"
      HTTPS_PROXY: "${TELEGRAM_PROXY_URL}"
      NO_PROXY: "postgres,redis,kafka,jaeger,localhost,127.0.0.1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: "promtail"
      service: "notifier"

  token-miner:
      build:
        context: ./token-miner
        dockerfile: Dockerfile
      container_name: pt_token_miner
      init: true
      environment:
        REDIS_URL: "redis://redis:6379"
        WB_TOKEN_POOL_SIZE: "5"
        WB_SEARCH_QUERY: "телефон"
        MINE_INTERVAL_HOURS: "12"
        MINE_RETRY_MINUTES: "10"
        MINE_MAX_RELOADS: "2"
        MINE_TIMEOUT_SECONDS: "150"
        WB_TOKEN_PROXY_URL: "http://lte2c8614d8-country-ru:wBD7AR4ndi1Q@resext-ru.lteboost.com:8989"
        HEADLESS: "false"
        LOG_LEVEL: "INFO"
      shm_size: "1gb"
      depends_on:
        redis:
          condition: service_healthy
      labels:
        logging: "promtail"
        service: "token-miner"

  scheduler:
      build:
        context: .
        dockerfile: Dockerfile
        args:
          SERVICE: scheduler
      container_name: pt_scheduler
      environment:
        DATABASE_URL: "postgres://user:password@postgres:5432/tryberrybot?sslmode=disable"
        KAFKA_BROKERS: "kafka:29092"
        SCRAPE_INTERVAL_MINUTES: "15"
        SCHEDULER_HEALTH_PORT: "8092"
        OTLP_ENDPOINT: "jaeger:4317"
      depends_on:
        postgres:
          condition: service_healthy
        kafka:
          condition: service_healthy
        jaeger:
          condition: service_started
      labels:
        logging: "promtail"
        service: "scheduler"

  postgres:
    image: postgres:16
    container_name: pt_postgres
    environment:
      POSTGRES_DB: tryberrybot
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tryberrybot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pt_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pt_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pt_kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # ВНУТРЕННИЙ listener для общения между контейнерами (kafka-exporter, etc)
      # ВНЕШНИЙ listener для подключения с хоста (наши Go-сервисы)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 10
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── Observability ─────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pt_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--web.enable-lifecycle'  # позволяет reload конфига без рестарта
    # Linux — нужен extra_hosts чтобы достучаться до хоста
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.2.0
    container_name: pt_loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'

  promtail:
    image: grafana/promtail:3.2.0
    container_name: pt_promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-config.file=/etc/promtail/config.yml'
    depends_on:
      - loki

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pt_postgres_exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://user:password@postgres:5432/tryberrybot?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: pt_redis_exporter
    ports:
      - "9121:9121"
    command:
      - '--redis.addr=redis://redis:6379'
      - '--check-single-keys=wb:search:token:mined_at,wb:search:token:exp,wb:search:pool:healthy,wb:search:pool:oldest_mined_at'
    depends_on:
      redis:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: pt_kafka_exporter
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:29092'
    depends_on:
      kafka:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pt_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/config:ro
      - alertmanager_data:/alertmanager
    environment:
      TELEGRAM_ALERT_BOT_TOKEN: "${TELEGRAM_ALERT_BOT_TOKEN}"
      TELEGRAM_ALERT_CHAT_ID: "${TELEGRAM_ALERT_CHAT_ID}"
    user: root
    entrypoint: [ "/bin/sh", "/config/entrypoint.sh" ]


  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pt_jaeger
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC (куда сервисы шлют спаны)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Хранение в памяти — для пет-проекта норм
      SPAN_STORAGE_TYPE: "memory"
      # Лимит спанов в памяти, дальше старые вытесняются
      MEMORY_MAX_TRACES: "50000"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pt_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Анонимный доступ для удобства разработки (на проде отключим)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
      - loki
      - jaeger

#  node-exporter:
#    image: prom/node-exporter:v1.8.2
#    container_name: pt_node_exporter
#    ports:
#      - "9100:9100"
#    command:
#      - '--path.rootfs=/host'
#    volumes:
#      - /:/host:ro,rslave
#    pid: host

volumes:
  pgdata:
  prometheus_data:
  loki_data:
  alertmanager_data:
  grafana_data:
