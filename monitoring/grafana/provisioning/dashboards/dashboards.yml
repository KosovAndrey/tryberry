apiVersion: 1

providers:
  - name: 'tryberrybot'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30  # автоперечитывание файлов каждые 30с
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false