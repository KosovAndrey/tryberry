# Alerting rules — условия при которых Prometheus генерирует алерты
# и отправляет в Alertmanager.
#
# Структура алерта:
#   alert    — имя
#   expr     — PromQL запрос. Если возвращает данные — алерт активен.
#   for      — сколько подряд expr должен быть true до отправки (защита от шума)
#   labels   — для маршрутизации в Alertmanager (severity, service)
#   annotations — текст для шаблона уведомления

groups:
  - name: tryberrybot_critical
    interval: 30s
    rules:
      # Любой из наших сервисов перестал отвечать
      - alert: ServiceDown
        expr: up{job=~"tryberrybot-.+"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Сервис {{ $labels.job }} недоступен"
          description: "Prometheus не может достучаться до {{ $labels.job }} больше 1 минуты"

      # Сервисы на dns_sd (scraper, reseller-worker) ServiceDown НЕ покрывает:
      # у них нет статического target. Умерла последняя реплика → пропала A-запись
      # → пропал target → серии up{} нет вовсе, а `up == 0` по несуществующей серии
      # не матчится никогда. absent() ловит именно этот случай: 1, когда серии нет.
      # Смерть ЧАСТИ реплик тихая by design (группа переберёт партиции); лаг
      # оставшихся ловит ConsumerLag.
      - alert: DiscoveredServiceGone
        expr: absent(up{job="tryberrybot-scraper"}) or absent(up{job="tryberrybot-reseller-worker"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Сервис исчез из DNS-discovery"
          description: "Ни одной реплики scraper/reseller-worker в A-записи 2+ минуты — все реплики мертвы либо имя не резолвится. Проверить: docker compose ps scraper reseller-worker."

      # Постгрес недоступен
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL недоступен"
          description: "postgres-exporter не отвечает {{ $value }}m"

      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis недоступен"
          description: "redis-exporter не может подключиться к Redis"

      # Kafka недоступен — критично, без него вся система встаёт
      - alert: KafkaDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka недоступен"
          description: "Сообщения не доставляются, система деградирует"

  - name: tryberrybot_scraping
    interval: 30s
    rules:
      # Высокий процент ошибок скрейпинга.
      # Порог объёма (>0.05 rps ≈ 15 запросов за 5 минут) отсекает шум редких
      # запросов. Без него разомкнутая брейкером цепь держала бы алерт вечно: там
      # к площадке уходит одна проба в 5–60 минут, и она по определению падает —
      # доля ошибок 100% при копеечном объёме. Про остановленный скрейп говорит
      # ScrapeCircuitOpen, а этот алерт — про качество живого потока.
      - alert: HighScrapeErrorRate
        expr: |
          (
            sum(rate(tryberrybot_scrape_requests_total{status!="success"}[5m])) by (marketplace)
            /
            sum(rate(tryberrybot_scrape_requests_total[5m])) by (marketplace)
          ) > 0.5
          and
          sum(rate(tryberrybot_scrape_requests_total[5m])) by (marketplace) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокий процент ошибок скрейпинга {{ $labels.marketplace }}"
          description: "Больше 50% запросов к {{ $labels.marketplace }} падают за последние 5 минут (текущее: {{ $value | humanizePercentage }})"

      # Маркетплейс начал блокировать
      - alert: MarketplaceBlocked
        expr: |
          increase(tryberrybot_scrape_requests_total{status="blocked"}[5m]) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Маркетплейс {{ $labels.marketplace }} блокирует запросы"
          description: "5+ блокировок за 5 минут. Возможно нужен новый IP/VPN/User-Agent."

      # Брейкер разомкнул цепь: мы САМИ перестали стучаться к площадке, потому что
      # она режет по IP. Это главный сигнал «скрейпинг площадки стоит» — сам
      # MarketplaceBlocked после размыкания затихает (настоящих запросов больше нет).
      - alert: ScrapeCircuitOpen
        expr: |
          max by (marketplace) (tryberrybot_scrape_circuit_open) == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Скрейпинг {{ $labels.marketplace }} приостановлен брейкером"
          description: "Площадка блокировала запросы подряд — цепь разомкнута, запросы давятся без обращения к сети. Пробы идут раз в 5–60 минут; цепь закроется сама, когда площадка ответит. Если висит часами — нужен другой IP/прокси."

      # Прокси отвергает/недоступен (407/502) — это НЕ антибот, а истёкший/сломанный прокси
      - alert: ScrapeProxyFailing
        expr: |
          increase(tryberrybot_scrape_requests_total{status="proxy"}[5m]) > 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Прокси скрейпинга {{ $labels.marketplace }} не отвечает (407/502)"
          description: "3+ ошибок уровня прокси за 5 минут. Вероятно истёк/сломался прокси — обновить OZON_PROXY_URL в .env и пересоздать scraper+bot-worker (--force-recreate)."

      # Аккаунт-сессия скрейпера протухла (401 / страница логина вместо карточки).
      # Громкий критикал: иначе протухание токена растворится в "not_found"/"error".
      - alert: ScrapeAuthExpired
        expr: |
          increase(tryberrybot_scrape_requests_total{status="auth"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Сессия скрейпера {{ $labels.marketplace }} протухла (нужен свежий токен)"
          description: "Ozon вернул 401/страницу логина — access-token истёк. Снять свежий OZON_COOKIE (HTTP Toolkit) и recreate scraper+bot-worker, либо включить авто-рефреш."

      # Скрейпер маркетплейса выключен (не сконфигурён — нет cookie/токена/прокси)
      - alert: ScrapeMarketplaceDisabled
        expr: |
          increase(tryberrybot_scrape_requests_total{status="disabled"}[10m]) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Скрейпер {{ $labels.marketplace }} отключён (не сконфигурён)"
          description: "Скрейпер возвращает ErrNotImplemented — проверь OZON_COOKIE/OZON_PROXY_URL в .env (возможна опечатка → невалидный URL → scraper disabled)."

      # Ozon-сайдкар жив, но ни одной прогретой дорожки. Процесс-даун ловит
      # ServiceDown (up==0); здесь — процесс отвечает, а camoufox не может
      # пере-пройти FAB: вероятно протух refresh-token/FAB-пропуск cookie-сессии.
      # Ozon-скрейп и поиск по ссылке встают → нужен переинжект свежих кук.
      - alert: OzonMinerNoHealthyLanes
        expr: ozon_miner_healthy_lanes == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Ozon-сайдкар: нет живых дорожек"
          description: "ozon-miner отвечает, но 0 прогретых дорожек 10+ минут — camoufox не проходит FAB (протух refresh-token/FAB-пропуск). Снять свежий OZON_COOKIE (HTTP Toolkit через мобильный прокси) и пересоздать ozon-miner: docker compose up -d --force-recreate ozon-miner."

      # Пул жив, но наполовину пуст. Строгий ноль выше не ловит САМЫЙ частый
      # сценарий: анонимные дорожки перестают проходить FAB, а авторизованная
      # держится — пул числится живым, при этом весь поток сериализуется на
      # остатке и p95 уезжает в десятки секунд (02-09: 1 живая из 6 неделю,
      # узнали кружным путём по HighScrapeLatency). Порог по ДОЛЕ, а не по
      # числу: он не врёт при смене OZON_POOL_SIZE.
      - alert: OzonMinerDegradedPool
        expr: |
          ozon_miner_healthy_lanes / ozon_miner_total_lanes < 0.5
          and ozon_miner_total_lanes > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ozon-сайдкар: пул наполовину мёртв"
          description: "Живых дорожек меньше половины ({{ $value | humanizePercentage }} от пула) 15+ минут. Весь поток Ozon идёт через остаток — очередь на локе дорожки даёт p95 в десятки секунд. Смотреть 'прогрев не дал 200' в логах pt_ozon_miner: это FAB не пускает анонимные дорожки с нашего IP — лечится не рестартом, а egress'ом либо снижением спроса (OZON_INTERVAL_MULTIPLIER)."

      # Живых АНОНИМНЫХ дорожек нет — массовый поток (товары, выдача, витрина)
      # не обслуживается вовсе, хотя пул числится живым за счёт authed-дорожки.
      # До 07-09-2026 в этом месте был тихий фолбэк на authed: пул отдавал 200,
      # алерты молчали, и десять часов ~250 запросов/час шло под аккаунтом.
      # Фолбэк убран (Pool.pick/pick_any), отказ теперь явный — и виден здесь.
      - alert: OzonMinerNoAnonLanes
        expr: ozon_miner_anon_lanes == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Ozon-сайдкар: нет анонимных дорожек — массовый поток стоит"
          description: "0 живых анонимных дорожек 10+ минут: товары, выдача и витрина Ozon получают 502 (счётчик ozon_miner_anon_starved_total растёт), authed-дорожка держится только под 18+. Причина в логах pt_ozon_miner — 'прогрев не дал 200' означает, что FAB не пускает анонимные сессии с нашего IP: лечится egress'ом или снижением спроса (OZON_INTERVAL_MULTIPLIER), рестарт бесполезен."

      # Ранний сигнал того же отказа, ЗА ЧАСЫ до простоя. Дорожка живёт сверх
      # своего возраста только в одном случае: она последняя живая анонимная, а
      # соседка не может прогреться — то есть FAB прямо сейчас не выдаёт новых
      # анонимных сессий с нашего адреса (Pool._only_live_anon). Площадка ещё
      # обслуживается, но запаса нет: умрёт эта сессия — станет весь массовый
      # поток. Инцидент 08-09-2026: без этого правила recycle забрал ОБЕ рабочие
      # сессии в окне отказа FAB, и площадка встала на шесть часов.
      # ВАЖНО: пересоздание сайдкара по этому алерту — худшее из действий, оно
      # выбрасывает единственную работающую сессию. Лечение — egress.
      - alert: OzonMinerDeferredRecycles
        expr: ozon_miner_deferred_recycles > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Ozon-сайдкар: анонимная дорожка живёт сверх возраста — заменить некем"
          description: "{{ $value }} анонимных дорожек час и дольше живут сверх планового возраста: пул не отдаёт последнюю рабочую сессию, потому что соседки не прогреваются — FAB не выдаёт новых анонимных сессий с нашего IP. Площадка пока обслуживается одной сессией и без запаса. НЕ пересоздавать сайдкар (выбросит единственную рабочую дорожку) — смотреть 'recycle отложен' и 'прогрев не дал 200' в логах pt_ozon_miner, решение — отдельный egress под анонимные дорожки."

      # Браузерный сайдкар подходит к своему mem_limit. Одно правило на все три:
      # метрика общая (sidecar_memory_bytes), площадку различает лейбл service.
      # Метрик уровня контейнера у нас нет — cAdvisor не подключён, — поэтому до
      # 03-09-2026 «сколько ест сайдкар» узнавалось только руками по ssh, и про
      # ali мы узнавали ПОСТФАКТУМ, по OOM-алерту и упавшему рендереру. 80% от
      # потолка — это запас на подъём, а не постфактум: у ali пик одного запроса
      # добавляет к базовому расходу больше гигабайта за секунды.
      #
      # Считаем по anon, а НЕ по memory.current. Первая версия правила (03-09)
      # смотрела на current и тут же дала ложную тревогу: current включает
      # вытесняемый страничный кэш, ozon-miner штатно упирается им в потолок
      # (максимум за сутки 5.99 ГиБ из 6), ядро сбрасывает кэш и расход
      # откатывается. До OOM остаётся ровно столько, сколько до лимита у anon.
      - alert: SidecarMemoryHigh
        expr: |
          sidecar_memory_anon_bytes / sidecar_memory_limit_bytes > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Сайдкар {{ $labels.service }} подходит к потолку памяти"
          description: "Расход {{ $value | humanizePercentage }} от mem_limit дольше 15 минут. Если плато уехало — либо recycle не успевает (LANE_MAX_AGE у соответствующего сайдкара), либо появилась новая течь. Смотреть sidecar_memory_bytes рядом с <sidecar>_lane_age_seconds: рост, привязанный к возрасту браузера, лечится recycle, рост внутри запроса — потолком. Поднимать потолок вслепую НЕЛЬЗЯ: сумма mem_limit уже 16 ГиБ при 15.6 физических (см. комментарий у ali-miner в docker-compose)."

      # ГЛАВНЫЙ алерт по Ozon-сайдкару: healthy_lanes ВРЁТ при залипании драйвера.
      # Инцидент 29-07: подвисший драйвер держал лок дорожки, обслуживание встало,
      # пул 11ч отдавал нули при healthy_lanes=4 — NoHealthyLanes промолчал, пришли
      # только warning'и «медленный/ошибочный скрейп ozon». Возраст последнего
      # успеха не обманешь: он растёт при ЛЮБОЙ причине простоя пула.
      - alert: OzonMinerStale
        expr: ozon_miner_last_success_age_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Ozon-сайдкар: нет успешных скрейпов 15+ минут"
          description: "ozon-miner отвечает, но ни одного успешного скрейпа/прогрева 15+ минут (дорожки могут числиться healthy). Смотреть ozon_miner_stuck_lanes и логи pt_ozon_miner; лечение — docker compose up -d --force-recreate ozon-miner."

      # Дорожка держит лок дольше порога = подвисший драйвер. Вотчдог снимает с
      # неё healthy и пересоздаёт браузер сам; алерт нужен, если это повторяется.
      - alert: OzonMinerStuckLanes
        expr: ozon_miner_stuck_lanes > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ozon-сайдкар: залипшие дорожки"
          description: "{{ $value }} дорожек ozon-miner держат лок дольше порога 15+ минут — вотчдог не смог их расклинить (драйвер не отменяется). Нужен --force-recreate ozon-miner и разбор логов."

      # WB-search-сайдкар жив, но ни одной прогретой дорожки. Процесс-даун ловит
      # ServiceDown; здесь процесс отвечает, но браузер не проходит wbaas-стену
      # (create-token 498). Горячие WB-запросы перестают чиниться (уходят в 403).
      # Частая причина — дрейф версии patchright (пин 1.60.1) или тайтенинг wbaas.
      # Условие «к сайдкару обращались» — как у WbSearchMinerStale ниже: с 24-08
      # основной путь идёт на публичный search.wb.ru, и сайдкар по замыслу
      # простаивает (после переезда плеч 28-08 — вообще ни одного обращения за
      # сутки). Без добавки правило звенело бы про исправную тишину, а вечный
      # алерт учит игнорировать алерты. Нет дорожек И НИКТО НЕ ЗВАЛ — это не
      # инцидент, а нормальная работа основного пути.
      # Третья добавка (01-09): дорожек может не быть НАМЕРЕННО. Пока прод-IP у
      # wbaas в бане, браузер бесполезен (стена + 3 ГиБ памяти на ретраи), и
      # WB_SEARCH_POOL_SIZE=0 выключает его штатно — /search как отвечал 502, так
      # и отвечает. Серии wb_search_miner_lane_age_seconds при нулевом пуле нет
      # вовсе: это и есть признак «дорожек не заведено», в отличие от «заведены,
      # но не прогреваются». Без этого условия правило звенело бы вечно.
      - alert: WbSearchMinerNoHealthyLanes
        expr: |
          wb_search_miner_healthy_lanes == 0
          and on()
          (sum(rate(tryberrybot_wb_search_fetch_total{transport="browser"}[1h])) > 0)
          and on()
          (count(wb_search_miner_lane_age_seconds) > 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "WB-search-сайдкар: нет живых дорожек, а фолбэк нужен"
          description: "wb-search-miner отвечает, но 0 прогретых дорожек 15+ минут, и при этом за последний час его ЗВАЛИ — значит direct-путь сыпется, а фолбэк не работает. Браузер не проходит wbaas-стену (create-token 498): проверить версию patchright (пин 1.60.1) и логи дорожки; при тайтенинге wbaas — обновить движок. Простой без обращений алертом НЕ считается — с 24-08 сайдкар по замыслу простаивает."

      # Основной путь WB-поиска (direct на публичный search.wb.ru) не отдаёт НИ
      # одного успеха, а сайдкар при этом работает — значит поиск целиком уехал в
      # браузер: он дорогой, тянет одну страницу вместо пяти и вывозит примерно
      # половину запросов. Так выглядит мёртвый поисковый egress (inbound xray
      # :8889) — отказ 27-08, который в метриках читался как ТИШИНА, а не как
      # ошибки; с тех пор транспортные ошибки считаются как direct+error.
      # Условие «сайдкар работает» отсекает штатный простой без запросов.
      - alert: WbSearchDirectDown
        expr: |
          sum(increase(tryberrybot_wb_search_fetch_total{transport="direct",result="ok"}[15m])) == 0
          and
          sum(increase(tryberrybot_wb_search_fetch_total{transport="browser"}[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "WB-поиск: direct не даёт успехов, всё идёт через браузер"
          description: "За 15 минут ни одного успешного direct-запроса к поисковой ручке WB при живом браузерном фолбэке. Смотреть долю result=error (egress не пропускает) против 429/forbidden (лимит/бан WB): sum by (result) (increase(tryberrybot_wb_search_fetch_total{transport=\"direct\"}[15m])). Проверить ручку и плечи: python3 scripts/wb-endpoint-probe.py --proxy http://xray:8889 --repeat 5 (сравнить u-search.wb.ru с search.wb.ru) и python3 scripts/wb-lane-test.py --lanes xray/config.json (мёртвые плечи). Рычаги в .env: WB_SEARCH_API_BASE (ручка) и SEARCH_PROXY_URLS/RESELLER_SEARCH_PROXY_URLS (8889 random, 8888 липкий). WB меняет ручки местами: 01-09 search.wb.ru закрылся 429, 17-09 закрылся u-search (403 wbaas всем, включая все плечи), а search.wb.ru открылся — сперва сравнить обе ручки пробой, потом переключать."

      # ГЛАВНЫЙ алерт по WB-сайдкару: healthy_lanes ВРЁТ при залипании драйвера.
      # Инцидент 13-08: /search висел бесконечно (чтение тела ответа было без
      # дедлайна и держало лок дорожки), при этом healthy_lanes=1 и метрики
      # зелёные — ровно тот же отказ, что у ozon-miner 29-07. Возраст последнего
      # успеха не врёт: он растёт, даже когда дорожка «здорова».
      # Условие «к сайдкару обращались» обязательно: он по замыслу простаивает,
      # когда основной путь работает, а с 24-08 (WB_SEARCH_API_BASE на публичный
      # search.wb.ru) не зовётся вовсе. Без этой добавки правило звенело каждые
      # 4 часа про исправную тишину — а вечный алерт учит игнорировать алерты.
      # Стену как таковую ловит WbSearchMinerNoHealthyLanes, здесь — именно
      # «звали и не смогли».
      - alert: WbSearchMinerStale
        expr: |
          wb_search_miner_last_success_age_seconds > 3600
            and on()
          (sum(rate(tryberrybot_wb_search_fetch_total{transport="browser"}[1h])) > 0)
            and on()
          (count(wb_search_miner_lane_age_seconds) > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WB-search-сайдкар: нет успешных запросов час"
          description: "wb-search-miner ЗВАЛИ за последний час, и ни один запрос/прогрев не удался (дорожки могут числиться healthy). Значит фолбэк на 403 не работает — горячие WB-запросы сейчас падают. Смотреть wb_search_miner_stuck_lanes и логи pt_wb_search_miner; лечение — docker compose up -d --force-recreate wb-search-miner. Простой без обращений алертом больше НЕ считается (правило требует ненулевой rate браузерных запросов)."

      # Дорожка держит лок дольше порога = подвисший драйвер. Вотчдог снимает с
      # неё healthy и пересоздаёт браузер сам; алерт нужен, если это повторяется.
      - alert: WbSearchMinerStuckLanes
        expr: wb_search_miner_stuck_lanes > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "WB-search-сайдкар: залипшие дорожки"
          description: "У wb-search-miner дорожка держит лок дольше порога 15+ минут. Вотчдог должен был снять healthy и пересоздать браузер — если алерт держится, вотчдог не справляется, смотреть логи pt_wb_search_miner."

      # Ali-сайдкар: тот же вотчдог, что у ozon/wb. healthy_lanes при залипании
      # драйвера врёт — возраст последнего успеха не врёт.
      - alert: AliMinerStale
        expr: ali_miner_last_success_age_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ali-сайдкар: нет успешных запросов час"
          description: "ali-miner отвечает, но ни одного успешного запроса/прогрева больше часа (дорожки могут числиться healthy). Смотреть ali_miner_stuck_lanes и логи pt_ali_miner; лечение — docker compose up -d --force-recreate ali-miner."

      - alert: AliMinerStuckLanes
        expr: ali_miner_stuck_lanes > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ali-сайдкар: залипшие дорожки"
          description: "У ali-miner дорожка держит лок дольше порога 15+ минут. Вотчдог должен был снять healthy и пересоздать браузер — если алерт держится, смотреть логи pt_ali_miner."

      # Высокая латентность скрейпинга
      - alert: HighScrapeLatency
        expr: tryberrybot:scrape_duration_p95:5m > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Медленный скрейпинг {{ $labels.marketplace }}"
          description: "p95 латентности > 10s в течение 5 минут (текущее: {{ $value | humanizeDuration }})"

      # WB: товар не нашёлся ни на одном basket-шарде (удалён / трансгран. Ali не в
      # CDN / баскет за окном проб). Раньше per-event (increase>0, for:0m) — пейджил
      # на каждый удалённый артикул, который скрейпится каждый цикл (это «норма» по
      # аннотации). Загрублено (2026-06-23): порог >5 за 15м + for:5m — одиночные
      # удалённые товары молчат, а реальный сбой резолва (формула уехала / шард лёг,
      # десятки not_found) ловится. Дрейф формулы отдельно ловит WBBasketFormulaDrift.
      # Ещё загрублено (2026-07-06): под нагрузочным объёмом (5k синтетиков) фоновая
      # доля удалённых/трансгран. артикулов давала >5/15м → алерт флапал; >20/15м
      # оставляет фон молчащим, реальный обвал резолва (десятки not_found) ловит.
      - alert: WBBasketNotFound
        expr: increase(tryberrybot_wb_basket_resolve_total{outcome="not_found"}[15m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WB: всплеск товаров не найденных в basket-CDN"
          description: "За 15 мин >5 WB-товаров не найдены ни на одном basket-шарде. Артикулы: docker logs pt_scraper pt_bot_worker | grep -iE 'scrape|basket'. Единичные удалённые/трансграничные (Ali) — норма; всплеск = проблема резолва."

      # WB: формула баскета сильно промахнулась (нашли далёким перебором >±4) —
      # пора расширить таблицу/окно в wbBasketNumber.
      # Загрублено (2026-07-06): путь САМОЗАЖИВАЕТСЯ — товар всё равно находится пробой
      # соседей и результат кэшируется (vol→basket), т.е. probe_far — не инцидент, а
      # напоминание обновить таблицу. Прежний >0/for:0m пейджил на каждый единичный
      # far-probe и флапал. >30/10м + for:10m = формула настолько устарела, что десятки
      # резолвов ходят далёким перебором (реальная латентность) — тогда чинить таблицу.
      - alert: WBBasketFormulaDrift
        expr: increase(tryberrybot_wb_basket_resolve_total{outcome="probe_far"}[10m]) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "WB: формула basket-шарда уехала"
          description: "За 10 мин >30 WB-товаров находились далёким перебором (>±4 от формулы) — wbBasketNumber отстал от новых vol-диапазонов, обнови таблицу порогов."

  - name: tryberrybot_kafka
    interval: 30s
    rules:
      # Consumer не успевает обрабатывать.
      # Порог/окно подняты (2026-06-23): при текущем объёме (~4k price-events/сут,
      # хендлер ~53мс) lag>100 на 5м ловил самозаживающий всплеск — пачка
      # уведомлений на одной партиции (ключ=product_id) упиралась в медленный
      # Telegram-egress и за минуты рассасывалась. Реальную хронику (egress лёг /
      # консьюмер встал) видно как устойчивый lag>300 дольше 15м; severe ловит
      # CriticalKafkaConsumerLag. Структурный фикс — задача «Бандлинг».
      # Порог поднят (2026-07-06): под нагрузочным тестом (5k синтетиков) scraper —
      # заведомо узкое место, партиции scrape-tasks штатно держат lag ~300-550 и
      # алерт флапал на границе 300. >1000/партицию за 15м = партиция реально
      # застряла (консьюмер встал / завис хендлер), а не штатный backlog под нагрузкой.
      - alert: HighKafkaConsumerLag
        expr: kafka_consumergroup_lag > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Высокий consumer lag в {{ $labels.topic }}"
          description: "Группа {{ $labels.consumergroup }} отстаёт на {{ $value }} сообщений в топике {{ $labels.topic }} дольше 15 минут"

      # Сообщения копятся очень сильно. Порог поднят вслед за warning (2026-07-06):
      # >2500/партицию — недостижимо штатным backlog'ом, только реальный затык.
      - alert: CriticalKafkaConsumerLag
        expr: kafka_consumergroup_lag > 2500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Критический lag в {{ $labels.topic }}"
          description: "Воркер не справляется: lag {{ $value }} в топике {{ $labels.topic }}. Нужно масштабировать."

      # Партиция заморожена при живом консьюмере: вотермарк коммита не двигается,
      # хотя сообщения выше курсора обрабатываются. Так выглядели инциденты 14-07 и
      # 31-07 (одна партиция, остальные в нулях, ошибок в логах нет) — их ловили
      # только по lag'у, спустя 8 часов роста. Метрика видит затык за минуты и
      # адресует его к конкретной реплике (instance), а не ко всей группе.
      # Порог 10 мин: перекрывает SCRAPE_HANDLER_TIMEOUT (120с) с большим запасом,
      # чтобы медленный, но живой обработчик не флапал алертом.
      - alert: KafkaPartitionStuck
        expr: tryberrybot_kafka_partition_stuck_seconds > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Партиция {{ $labels.topic }} застряла на {{ $labels.instance }}"
          description: "Вотермарк коммита не двигается {{ $value }}с при работающем консьюмере — заморожена партиция (зависший обработчик или разъехавшийся трекер). Рестарт реплики {{ $labels.instance }} расклинивает; смотри kafka-consumer-groups --describe --group price-tracker."

      # Сообщение выброшено после исчерпания ретраев обработки (Consumer.Run,
      # handlerRetries=3). Это ПОТЕРЯ: для price-events — непосчитанное решение
      # по подписке, для payments — неприменённая оплата до следующего вебхука.
      # В покое метрика обязана быть нулевой, поэтому порог «больше нуля», а не
      # доля: любое срабатывание — повод посмотреть, что именно падает.
      # Три попытки с паузой 500мс переживают обычный сбой БД, значит устойчивые
      # drop'ы означают что-то системное (пул соединений исчерпан, миграция под
      # нагрузкой, битый payload).
      # for: 5m — чтобы одиночный drop на рестарте Postgres не будил зря.
      - alert: KafkaMessagesDropped
        expr: increase(tryberrybot_kafka_messages_consumed_total{status="dropped"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Потеряны сообщения из {{ $labels.topic }}"
          description: "За 15 мин выброшено {{ $value }} сообщений после трёх неудачных попыток обработки. Причина в логах: docker compose logs --since 30m | grep DROPPING. Восстановление обычно само (следующий плановый скрейп даст новое событие), но для topic=payments это не так — там проверить payments со status='pending'."

  - name: tryberrybot_business
    interval: 1m
    rules:
      # Совсем нет уведомлений при наличии подписок — что-то сломано
      - alert: NoNotificationsButSubscriptionsExist
        expr: |
          tryberrybot_active_subscriptions > 0
          and
          sum(increase(tryberrybot_notifications_sent_total[6h])) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Нет уведомлений за 6 часов"
          description: "Активных подписок: {{ with query \"tryberrybot_active_subscriptions\" }}{{ . | first | value }}{{ end }}, но за 6 часов ноль уведомлений. Возможно цены не падают, но проверь воркер."

      # Outbox доставки не разгребается: флашер не успевает слать. В норме глубина
      # ~0 (флашер ~25/с = 1500/мин, всплеск сливается за секунды). Устойчивая
      # глубина >100 дольше 10м = доставка встала: Telegram-egress лёг / жёсткий
      # 429-троттл / осели исчерпанные строки (юзер заблокировал бота, attempts на
      # потолке). Не критично для приёма команд, но юзеры не получают алерты.
      # См. docs/SCALING-NOTIFIER-DELIVERY.md.
      # Порог поднят (2026-07-06): под нагрузочным тестом волны алертов штатно давали
      # глубину 100-210, которая рассасывается за минуты → флап на границе 100. Флашер
      # ~1500/мин, поэтому 500 висящих ДОЛЬШЕ 15м = egress реально встал (Telegram лёг /
      # жёсткий 429), а не штатный всплеск доставки.
      - alert: PendingAlertsBacklog
        expr: tryberrybot_pending_alerts_depth > 500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Очередь доставки уведомлений не разгребается"
          description: "Недоставленных pending_alerts: {{ $value }} (>100) дольше 10 мин. Флашер не успевает: проверь egress в Telegram (xray) и долю failed — docker logs pt_notifier | grep flusher; rate(tryberrybot_pending_alerts_delivered_total{outcome=\"failed\"}[5m])."

  # ── «Бот молчит» — урок инцидента 2026-07-08 ──────────────────────────────
  # Битый TELEGRAM_BOT_TOKEN в .env → api/bot-worker 2 часа крутили getMe
  # Unauthorized, нотифаер дропал алерты после 10 попыток — и НИ ОДИН алерт не
  # сработал: контейнеры Up (/metrics отвечает → ServiceDown молчит), глубина
  # outbox не росла (flusher дропал → PendingAlertsBacklog молчит),
  # notifications_sent_total считает enqueue, не доставку. Эти три правила
  # закрывают дыру с трёх сторон: init, живость поллинга, исход отправок.
  - name: tryberrybot_bot_silence
    interval: 30s
    rules:
      # getMe не проходит: битый/отозванный токен или мёртвый egress. Gauge
      # экспортируют все бинари (promauto), поэтому фильтр по job — Telegram
      # инициализируют только api и bot-worker. for: 5m переживает штатный
      # деплой (init проходит за секунды).
      - alert: TelegramInitFailing
        expr: tryberrybot_telegram_connected{job=~"tryberrybot-(api|bot-worker)"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} не может инициализировать Telegram (getMe)"
          description: "getMe падает >5 мин — бот не принимает команды. Проверь токен: TOKEN=$(grep '^TELEGRAM_BOT_TOKEN=' .env | cut -d= -f2-); curl -s \"https://api.telegram.org/bot$TOKEN/getMe\". Если 401 — токен битый/отозван (.env, BotFather). Логи: docker logs pt_bot_worker | grep 'telegram init'."

      # Поллинг застыл ПОСЛЕ успешного старта: токен отозвали на лету / egress
      # умер. Здоровый long-poll двигает метку каждые ~10с даже без апдейтов,
      # поэтому 5 мин тишины = ~30 подряд неудачных поллов, не флап. Гард > 0
      # отсекает старт до первого успеха и webhook-режим (метка там всегда 0).
      - alert: TelegramPollingStale
        expr: |
          (time() - tryberrybot_telegram_poll_last_success_timestamp_seconds{job="tryberrybot-api"} > 300)
          and tryberrybot_telegram_poll_last_success_timestamp_seconds{job="tryberrybot-api"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "api: getUpdates не проходит >5 мин — бот не принимает команды"
          description: "Последний успешный long-poll был {{ $value | humanizeDuration }} назад. Причина в ошибках поллинга: rate(tryberrybot_telegram_poll_errors_total[5m]); токен — curl getMe; egress — dcp logs xray."

      # Приём апдейтов встал НА ЗАПИСИ в Kafka. Поллинг при этом здоров (метка
      # last_success двигается), поэтому TelegramPollingStale молчит, а бот всё
      # равно не отвечает: с 2026-08-27 ingestor не двигает оффсет getUpdates,
      # пока апдейт не записан, — сообщения не теряются, но копятся у Telegram.
      # Ловим факт «продюс в telegram-updates падает и не проходит»: error>0 без
      # success за 10 минут (unless — чтобы правило не онемело как раз тогда,
      # когда успешных записей нет вовсе).
      - alert: TelegramIngestStalled
        expr: |
          sum(increase(tryberrybot_kafka_messages_produced_total{topic="telegram-updates",status="error"}[10m])) > 0
          unless
          sum(increase(tryberrybot_kafka_messages_produced_total{topic="telegram-updates",status="success"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "api: апдейты Telegram не пишутся в Kafka — бот не отвечает"
          description: "Продюс в topic telegram-updates падает 5+ минут подряд, успешных записей нет. Апдейты не потеряны (оффсет getUpdates не подтверждается и Telegram отдаст их снова), но обработки нет. Смотреть брокер: docker logs pt_kafka --tail 100; логи приёмника: docker logs pt_api | grep -E 'publish update|ingest update failed'."

      # Все отправки канала падают (а не «нет трафика»): error>2 БЕЗ ok за 15м.
      # unless вместо and — если ok-серия за окно пуста, and не сматчился бы и
      # алерт молчал бы ровно тогда, когда всё лежит. Ловит и per-channel отказ
      # (отозвали только VK-токен), TG/VK/MAX — отдельными алертами.
      #
      # Правку 04-09-2026 диктует ложная тревога: в тихое окно ЕДИНСТВЕННОЙ
      # отправкой был алерт юзеру, который заблокировал бота, — error=1, ok=0,
      # critical при полностью живом канале (xray качал, токен целый). Закрыто с
      # двух сторон: отказ получателя теперь считается status="rejected" и сюда
      # не попадает (см. statusLabel в cmd/notifier/delivery.go), плюс порог >2 —
      # реальный отказ канала даёт ошибки пачкой (кафка ретраит транзиентные),
      # одиночная сетевая осечка больше не будит.
      - alert: NotificationChannelFailing
        expr: |
          sum by (channel) (increase(tryberrybot_notifications_delivered_total{status="error"}[15m])) > 2
          unless
          sum by (channel) (increase(tryberrybot_notifications_delivered_total{status="ok"}[15m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Доставка в {{ $labels.channel }} полностью падает"
          description: "За 15 мин все отправки в {{ $labels.channel }} с ошибкой, ни одной успешной (отказы получателей status=rejected сюда не входят). 401 = битый токен канала (.env/ЛК); иначе egress. Логи: docker logs pt_notifier --since 30m | grep -iE 'error|unauthorized'."
  # ── Ресурсы хоста ──────────────────────────────────────────────────────────
  # Заведено 20-08-2026 после первой глобальной OOM-аварии: ali-miner дорос по
  # аптайму до 6.7 ГиБ, хост (15 ГиБ, своп забит на 92%) исчерпал память,
  # ядро прибило chrome. Пока оно свопило, dockerd не успевал с health-check,
  # а systemd-resolved молчал → embedded DNS Docker (127.0.0.11) отвалился →
  # каскад ServiceDown по всем, кому нужен был свежий резолв.
  #
  # Метрик хоста в Prometheus тогда НЕ БЫЛО (node-exporter крутился, но джоба
  # для него не завели), поэтому предупредить было нечем. Эти правила ловят
  # ситуацию ЗАРАНЕЕ, а HostOOMKill — постфактум, но точно и с именем жертвы.
  - name: tryberrybot_host
    interval: 30s
    rules:
      # Ядро кого-то убило. Считаем по счётчику vmstat: даже если жертва
      # успела перезапуститься и внешне всё зелено, факт OOM виден.
      #
      # severity WARNING, а не critical (понижено 25-08). Метрика не отличает
      # контейнерный OOM от хостового, а на практике почти всегда прилетает
      # первый: процесс упёрся в свой mem_limit, вотчдог сайдкара его поднял,
      # хост цел. Будить по такому нельзя — за сутки прилетело ~20 «critical»
      # об исправно работающей защите, и это ровно тот шум, от которого потом
      # перестают читать алерты. Настоящую хостовую нехватку ловят HostMemoryLow
      # и HostSwapAlmostFull (заранее), а её последствия — ServiceDown (critical).
      - alert: HostOOMKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "OOM-killer сработал"
          description: "Ядро убило процесс из-за нехватки памяти за последние 10 мин. ПЕРВЫМ ДЕЛОМ отличить контейнерный OOM от хостового: sudo dmesg -T | grep -iE 'oom-kill|killed process' | tail. Есть constraint=CONSTRAINT_MEMCG и 'Memory cgroup out of memory' — процесс упёрся в mem_limit СВОЕГО контейнера, хост цел, защита сработала как задумано; чей это контейнер — сопоставить id из oom_memcg со списком docker ps --no-trunc -q; повторяется у одного и того же — поднять ему потолок или искать утечку. Нет CONSTRAINT_MEMCG — глобальная нехватка на хосте, это авария (20-08 рост chrome уронил DNS докера и каскадом всё остальное). Кто разросся: docker stats --no-stream."

      # Свободной памяти мало. 15% от 15 ГиБ ≈ 2.3 ГиБ — на таком остатке
      # браузерный сайдкар доедает запас за минуты.
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "На хосте мало памяти"
          description: "Доступно меньше 15% RAM больше 5 минут. Обычно это растущий по аптайму браузерный сайдкар (ozon/wb/ali-miner) — проверить docker stats и при необходимости пересоздать самый жирный."

      # Своп на исходе. Когда он кончится, следующий же запрос памяти
      # уйдёт в OOM — это последнее предупреждение перед аварией.
      - alert: HostSwapAlmostFull
        expr: (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Своп забит"
          description: "Занято больше 85% свопа 15+ минут. Дальше расти некуда: следующая нехватка памяти закончится OOM-killer'ом."

      # Ночной автоперекат плеч xray (cron 04:00) давно не завершался успешно.
      # 14–17.09 он трое суток падал молча (кавычки в XRAY_SUBS), провайдер тем
      # временем сменил узлы, поисковый пул :8889 вымер — узнали по WbSearchDirectDown
      # через сутки. 36ч = пропущен один ночной прогон плюс запас.
      - alert: XrayLanesAutoStale
        expr: time() - xray_lanes_auto_last_success_timestamp_seconds > 36 * 3600
        labels:
          severity: warning
        annotations:
          summary: "Автоперекат плеч xray не отрабатывает"
          description: "Последний успешный прогон scripts/xray-lanes-auto.py больше 36ч назад (код последнего выхода — xray_lanes_auto_last_exit_code). Смотреть tail -40 /tmp/xray-lanes-auto.log; руками: python3 scripts/xray-lanes-auto.py --dry-run из корня репо на ветке main. Пока скрипт стоит, мёртвые плечи копятся в пуле — проверить xray: docker logs --since 30m pt_xray | grep -c 'is dead'."

      # Метрики нет вовсе: cron снят, textfile-коллектор не подключён (node-exporter
      # пересоздан без prod-оверрайда) или скрипт ни разу не отработал.
      - alert: XrayLanesAutoMetricMissing
        expr: absent(xray_lanes_auto_last_run_timestamp_seconds)
        for: 26h
        labels:
          severity: warning
        annotations:
          summary: "Нет метрик автопереката плеч xray"
          description: "node-exporter не отдаёт xray_lanes_auto_*. Проверить: crontab -l | grep xray-lanes; ls -l monitoring/textfile/; docker inspect pt_node_exporter | grep textfile (коллектор подключается в docker-compose.prod.yml)."
