# Recording rules — предвычисленные агрегаты для быстрых дашбордов.
# Prometheus пересчитывает их каждые evaluation_interval (15s)
# и сохраняет как обычные метрики. Они быстрее чем сложные запросы в Grafana.

groups:
  - name: tryberrybot_recording
    interval: 30s
    rules:
      # Success rate скрейпинга по маркетплейсу (за 5 минут)
      - record: tryberrybot:scrape_success_rate:5m
        expr: |
          sum(rate(tryberrybot_scrape_requests_total{status="success"}[5m])) by (marketplace)
          /
          sum(rate(tryberrybot_scrape_requests_total[5m])) by (marketplace)

      # p95 латентности скрейпинга
      - record: tryberrybot:scrape_duration_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum(rate(tryberrybot_scrape_duration_seconds_bucket[5m])) by (marketplace, le)
          )

      # p99 латентности скрейпинга
      - record: tryberrybot:scrape_duration_p99:5m
        expr: |
          histogram_quantile(0.99,
            sum(rate(tryberrybot_scrape_duration_seconds_bucket[5m])) by (marketplace, le)
          )

      # RPS HTTP запросов
      - record: tryberrybot:http_requests:rate1m
        expr: |
          sum(rate(tryberrybot_http_requests_total[1m])) by (path, status)

      # Error rate уведомлений
      - record: tryberrybot:notifications_rate:5m
        expr: |
          sum(rate(tryberrybot_notifications_sent_total[5m])) by (marketplace)