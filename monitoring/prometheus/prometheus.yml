# Глобальные настройки Prometheus
global:
  # Как часто Prometheus идёт за метриками к экспортёрам
  scrape_interval: 15s
  # Таймаут одного scrape запроса
  scrape_timeout: 10s
  # Как часто пересчитывать recording/alerting rules
  evaluation_interval: 15s
  # Лейблы которые добавятся ко всем метрикам.
  # ЭТОТ ЖЕ ФАЙЛ едет на прод (compose монтирует его в обоих оверлеях), поэтому
  # значение отражает боевую установку: раньше здесь стояло env=dev, и все
  # прод-метрики и алерты в Telegram были помечены как dev. Отдельного окружения
  # с собственным Prometheus у проекта нет — появится, тогда и разведём.
  external_labels:
    env: prod

# Файлы с правилами (alerts, recording rules) — подключим в Этапе Д
rule_files:
  - /etc/prometheus/rules/*.yml

# Куда отправлять сработавшие алерты — подключим в Этапе Д
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Источники метрик
scrape_configs:

  - job_name: tryberrybot-api
    metrics_path: /metrics
    static_configs:
      - targets: [ 'api:8081' ]
        labels:
          service: api

  # Скрейпер масштабируется (prod-оверлей: replicas: 3) без container_name,
  # поэтому DNS-discovery: A-запись имени сервиса возвращает IP всех реплик.
  # Статический target резолвился в ОДНУ случайную реплику, а счётчики живут в
  # памяти КАЖДОГО процесса → success rate, латентность и *_price_source были
  # занижены втрое и врали (найдено 2026-07-15).
  - job_name: tryberrybot-scraper
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ 'scraper' ]
        type: A
        port: 8090
        refresh_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: scraper

  # Сайдкар Ozon (camoufox-пул дорожек). Имя job под общий префикс tryberrybot-*,
  # чтобы ServiceDown ловил падение процесса; живые дорожки — отдельным алертом.
  - job_name: tryberrybot-ozon-miner
    metrics_path: /metrics
    static_configs:
      - targets: [ 'ozon-miner:8080' ]
        labels:
          service: ozon-miner

  # Сайдкар WB-поиска (browser-as-transport для горячих запросов). Живые дорожки —
  # отдельным алертом; падение процесса ловит ServiceDown по префиксу tryberrybot-*.
  - job_name: tryberrybot-wb-search-miner
    metrics_path: /metrics
    static_configs:
      - targets: [ 'wb-search-miner:8081' ]
        labels:
          service: wb-search-miner

  # Сайдкар Ali-поиска (X5SEC-фолбэк). Метрик у него не собирали вовсе — вскрылось
  # 2026-08-13, когда к нему добавили вотчдог залипших дорожек: алерты
  # AliMinerStale/AliMinerStuckLanes без этого джоба были бы мёртвыми правилами.
  - job_name: tryberrybot-ali-miner
    metrics_path: /metrics
    static_configs:
      - targets: [ 'ali-miner:8082' ]
        labels:
          service: ali-miner

  - job_name: tryberrybot-notifier
    metrics_path: /metrics
    static_configs:
      - targets: [ 'notifier:8091' ]
        labels:
          service: notifier

  - job_name: tryberrybot-bot-worker
    metrics_path: /metrics
    static_configs:
      - targets: [ 'bot-worker:8093' ]
        labels:
          service: bot-worker

  - job_name: tryberrybot-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: [ 'scheduler:8092' ]
        labels:
          service: scheduler

  - job_name: tryberrybot-search-worker
    metrics_path: /metrics
    static_configs:
      - targets: [ 'search-worker:8094' ]
        labels:
          service: search-worker

  # Дорожка перекупов масштабируется (--scale reseller-worker=N) без
  # container_name, поэтому DNS-discovery: A-запись имени сервиса возвращает
  # IP всех реплик — статический target видел бы только одну.
  - job_name: tryberrybot-reseller-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ 'reseller-worker' ]
        type: A
        port: 8094
        refresh_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: reseller-worker

  # price-insight (JVM, Kafka Streams). Путь не /metrics: метрики отдаёт
  # actuator, у него свой префикс. Имя job СПЕЦИАЛЬНО без префикса tryberrybot-:
  # под него подписан ServiceDown (critical), а этот сервис штатно гасится руками
  # при откате (docker compose stop price-insight) — продукт от этого не страдает,
  # и будить дежурного незачем. Вернуть префикс, когда notifier начнёт реально
  # зависеть от вердикта.
  - job_name: price-insight
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'price-insight:8092' ]
        labels:
          service: price-insight

  # Сам Prometheus — стандартная практика мониторить и его
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL метрики
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  # Redis метрики
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis

  # Kafka метрики (consumer lag, topic size, etc)
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: kafka


  # Метрики ХОСТА (RAM, swap, CPU, disk). Контейнер поднимается только
  # prod-оверлеем (docker-compose.prod.yml), поэтому в чистом dev этот target
  # будет down — своего Prometheus у dev нет, расхождение осознанное.
  #
  # Джоб добавлен 20-08-2026 постфактум: node-exporter крутился на проде с
  # самого начала, но его НИКТО не скрейпил. Из-за этого глобальный OOM
  # (ali-miner дорос до 6.7 ГиБ) и своп, забитый на 92%, были не видны —
  # авария проявилась только каскадом ServiceDown, когда чинить было поздно.
  - job_name: node
    static_configs:
      - targets: [ 'node-exporter:9100' ]
        labels:
          service: host
