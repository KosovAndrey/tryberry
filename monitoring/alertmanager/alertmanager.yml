# Alertmanager группирует пришедшие алерты и решает кому их слать.
# Маршрутизация по labels (severity, service).
#
# Доставка в Telegram идёт через xray (proxy_url у каждого telegram_config), как
# и весь остальной egress бота: прямой путь с RU-хоста душит РКН. Раньше AM
# ходил напрямую и это прокатывало, но 2026-08-23 прямой маршрут умер совсем —
# AM по кругу ретраил `notify retry canceled after 2 attempts: context deadline
# exceeded`, и алерты (включая ✅ о восстановлении) до получателя не доезжали.
# Размен: если ляжет сам xray, алерт об этом тоже не доедет — оба плеча общие.

global:
  resolve_timeout: 5m

# Подключаем шаблоны для красивого форматирования
templates:
  - '/config/templates/*.tmpl'

# Главный route — корневой маршрут.
# Все алерты попадают сюда сначала, потом могут уйти в child routes.
route:
  # Группируем алерты по этим лейблам — если несколько одинаковых
  # пришло за короткое время, отправим одним сообщением.
  group_by: ['alertname', 'service']

  # Сколько ждать перед первой отправкой (даём времени собраться группе)
  group_wait: 10s

  # Минимальный интервал между сообщениями одной группы. ОН ЖЕ — бюджет времени
  # на доставку: Alertmanager отводит попыткам notify контекст, производный от
  # group_interval. При 30с две попытки через тоннель xray не укладывались, и
  # уведомления отменялись пачками («notify retry canceled after 2 attempts:
  # context deadline exceeded» непрерывно 12:20–14:15 UTC 24-08 — до получателя
  # доезжали случайные проскочившие). 3 минуты дают ретраям реальный запас;
  # на частоту сообщений влияет слабо — алерты и так группируются.
  group_interval: 3m

  # Через сколько повторять алерт если он всё ещё активен
  repeat_interval: 4h

  # По умолчанию шлём всё сюда
  receiver: telegram-default

  # Дочерние маршруты — для критичных шлём чаще
  routes:
    - matchers:
        - severity = "critical"
      receiver: telegram-critical
      group_wait: 5s
      repeat_interval: 30m  # критичные напоминаем каждые 30 мин

# Получатели — куда слать
receivers:
  - name: telegram-default
    telegram_configs:
      - bot_token: '${TELEGRAM_ALERT_BOT_TOKEN}'
        chat_id: ${TELEGRAM_ALERT_CHAT_ID}
        parse_mode: HTML
        message: '{{ template "telegram.message" . }}'
        send_resolved: true  # шлём когда алерт прошёл
        http_config:
          proxy_url: 'http://xray:8888'

  - name: telegram-critical
    telegram_configs:
      - bot_token: '${TELEGRAM_ALERT_BOT_TOKEN}'
        chat_id: ${TELEGRAM_ALERT_CHAT_ID}
        parse_mode: HTML
        message: '{{ template "telegram.message" . }}'
        send_resolved: true
        http_config:
          proxy_url: 'http://xray:8888'

# Inhibit rules — подавление: если есть один алерт, другой не шлём.
# Пример: если KafkaDown, нет смысла слать алерты про lag.
inhibit_rules:
  - source_matchers:
      - alertname = "KafkaDown"
    target_matchers:
      - alertname =~ "HighKafkaConsumerLag|CriticalKafkaConsumerLag"
    equal: ['service']

  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - severity =~ "warning|info"
    equal: ['service']