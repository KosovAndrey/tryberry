# Alertmanager группирует пришедшие алерты и решает кому их слать.
# Маршрутизация по labels (severity, service).

global:
  resolve_timeout: 5m

# Подключаем шаблоны для красивого форматирования
templates:
  - '/config/templates/*.tmpl'

# Главный route — корневой маршрут.
# Все алерты попадают сюда сначала, потом могут уйти в child routes.
route:
  # Группируем алерты по этим лейблам — если несколько одинаковых
  # пришло за короткое время, отправим одним сообщением.
  group_by: ['alertname', 'service']

  # Сколько ждать перед первой отправкой (даём времени собраться группе)
  group_wait: 10s

  # Минимальный интервал между сообщениями одной группы
  group_interval: 30s

  # Через сколько повторять алерт если он всё ещё активен
  repeat_interval: 4h

  # По умолчанию шлём всё сюда
  receiver: telegram-default

  # Дочерние маршруты — для критичных шлём чаще
  routes:
    - matchers:
        - severity = "critical"
      receiver: telegram-critical
      group_wait: 5s
      repeat_interval: 30m  # критичные напоминаем каждые 30 мин

# Получатели — куда слать
receivers:
  - name: telegram-default
    telegram_configs:
      - bot_token: '${TELEGRAM_ALERT_BOT_TOKEN}'
        chat_id: ${TELEGRAM_ALERT_CHAT_ID}
        parse_mode: HTML
        message: '{{ template "telegram.message" . }}'
        send_resolved: true  # шлём когда алерт прошёл

  - name: telegram-critical
    telegram_configs:
      - bot_token: '${TELEGRAM_ALERT_BOT_TOKEN}'
        chat_id: ${TELEGRAM_ALERT_CHAT_ID}
        parse_mode: HTML
        message: '{{ template "telegram.message" . }}'
        send_resolved: true

# Inhibit rules — подавление: если есть один алерт, другой не шлём.
# Пример: если KafkaDown, нет смысла слать алерты про lag.
inhibit_rules:
  - source_matchers:
      - alertname = "KafkaDown"
    target_matchers:
      - alertname =~ "HighKafkaConsumerLag|CriticalKafkaConsumerLag"
    equal: ['service']

  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - severity =~ "warning|info"
    equal: ['service']