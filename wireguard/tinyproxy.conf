# tinyproxy — HTTP CONNECT прокси для выхода к Telegram через WireGuard.
#
# Контейнер tinyproxy делит netns с wg-proxy (network_mode: service:wg-proxy),
# поэтому весь его исходящий трафик уходит в WG-туннель (не-RU exit).
# Слушает :8888; api/bot-worker/notifier ходят сюда как http://wg-proxy:8888.
# Доступен только изнутри docker-сети — порт наружу не публикуется.

User nobody
Group nobody

Port 8888
# Listen не задаём — биндимся на все интерфейсы netns (доступ по wg-proxy:8888).

Timeout 600
MaxClients 100
LogLevel Info

# Прокси внутренний — пускаем любые docker-клиенты.
Allow 0.0.0.0/0

# CONNECT только на HTTPS Telegram (api.telegram.org:443). 80 — на всякий случай.
ConnectPort 443
ConnectPort 80
