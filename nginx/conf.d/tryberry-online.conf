# ────────────────────────────────────────────────────────────────────────────
# tryberry.online — второй домен (зеркало основного сайта)
#
# Зачем: на iOS основной домен показывает предупреждение о мошенническом сайте.
#
# ⚠️ ЭТОТ ФАЙЛ — ЗАПАСНОЙ ВАРИАНТ, А НЕ ЛЕЧЕНИЕ. Сравнение с botyanit.ru
# (тот же reg.ru, тот же IP 194.164.245.150, тот же nginx, тот же Let's Encrypt —
# и никакого предупреждения) показало, что домен, хостинг, регистратор и CA
# ни при чём. Отличия только в контенте, главное из них — публичные пресс-кадры
# /screen*, /wall*, копирующие интерфейс мессенджера (закрыты basic-auth,
# см. комментарий в tryberry.conf). Правильный порядок: закрыть их → запросить
# перепроверку в Search Console → и только если вердикт не снимут, поднимать
# второй домен. Новый домен флаг не снимает, а обходит: при той же причине его
# зафлагают так же, просто позже.
#
# Если всё же поднимаем, .online работает как ЗЕРКАЛО, а не как новый основной
# домен:
#   • отдаёт ту же статику из ./web и те же /p/ и /api/ с api:8081;
#   • закрыт от индексации (X-Robots-Tag: noindex) — иначе получаем дубль
#     всего сайта и роняем SEO основного домена;
#   • canonical у SSR-страниц /p/ строится из PUBLIC_BASE_URL (env), а НЕ из
#     Host, поэтому он остаётся https://tryberry.ru — это правильно для зеркала;
#   • редиректа .ru → .online нет и быть не должно: вердикт браузера
#     срабатывает на первом домене, до редиректа.
#
# Если .online станет ОСНОВНЫМ: убрать X-Robots-Tag, поменять PUBLIC_BASE_URL
# в .env, добавить домен в sitemap/robots и развернуть 301 в обратную сторону.
#
# Порядок выкатки (сертификата ещё нет — см. tryberry-online-ssl.conf):
#   1. A/AAAA на IP сервера, ждём резолва;
#   2. кладём ТОЛЬКО этот файл, nginx -t && reload;
#   3. выпускаем сертификат (certbot --webroot);
#   4. включаем HTTPS-часть:
#        cp nginx/conf.d/tryberry-online-ssl.conf.tpl \
#           nginx/conf.d/tryberry-online-ssl.conf
#        docker exec tryberry_nginx nginx -t && \
#        docker exec tryberry_nginx nginx -s reload
#      (HTTPS-часть лежит как .tpl намеренно: nginx грузит только *.conf, а с
#       несуществующим сертификатом он не стартует — на .tpl это не наступит.)
# ────────────────────────────────────────────────────────────────────────────

server {
    listen      80;
    listen      [::]:80;
    server_name tryberry.online www.tryberry.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://tryberry.online$request_uri;
    }
}
