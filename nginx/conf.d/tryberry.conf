# ────────────────────────────────────────────────────────────────────────────
# tryberry.ru — production reverse proxy
#
# DNS-резолвинг upstream'ов — динамический через Docker DNS (127.0.0.11),
# поэтому nginx стартует даже если api/grafana временно недоступны.
# ────────────────────────────────────────────────────────────────────────────

# ── Map для WebSocket upgrade (нужен Grafana live) ──────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Catch-all: чужие Host/SNI (домены, прибитые к нашему IP) ────────────────
# Без этого nginx отдаёт наш сайт как дефолтный vhost любому домену,
# чья A-запись указывает на наш IP (см. инцидент seeworks.ru).

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ── HTTP: ACME challenge + redirect на HTTPS ────────────────────────────────

server {
    listen      80;
    listen      [::]:80;
    server_name tryberry.ru www.tryberry.ru grafana.tryberry.ru;

    # Webroot для Let's Encrypt HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: apex (tryberry.ru / www.tryberry.ru) ─────────────────────────────

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2 on;
    server_name tryberry.ru;

    ssl_certificate     /etc/letsencrypt/live/tryberry.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tryberry.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Docker internal DNS — для динамического резолва upstream'ов
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── Security-заголовки (аудит securityheaders: грейд D→A) ───────────────
    # Наследуются в location'ы БЕЗ своего add_header (в т.ч. `/` = лендинг и
    # `/p/` = SSR-графики). Статика (/assets,/vendor,/fonts) имеет собственный
    # add_header → эти сюда не тянутся, но им CSP/Permissions-Policy не нужны.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # CSP: 'unsafe-inline' обязателен — на лендинге инлайн <style>/<script> и
    # onclick-обработчики, на /p/ инлайн `window.__CHART__` с динамикой (hash/nonce
    # не подходят без переписывания шаблонов). `img https:` — фото товара с CDN
    # маркетплейсов на странице графика (product.html). COEP require-corp НЕ
    # ставим намеренно: он сломал бы эти же кросс-доменные картинки.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ── /webhook → api:8081/webhook (Telegram) ──────────────────────────────
    location = /webhook {
        limit_req zone=webhook burst=50 nodelay;

        if ($request_method !~ ^POST$) {
            return 405;
        }

        # Динамический upstream через переменную: nginx резолвит при запросе,
        # а не при старте. Если api лежит — будет 502, но nginx живой.
        set $upstream_api api:8081;
        proxy_pass http://$upstream_api/webhook;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── /vk/callback → api:8081/vk/callback (VK Callback API) ───────────────
    location = /vk/callback {
        limit_req zone=webhook burst=50 nodelay;

        if ($request_method !~ ^POST$) {
            return 405;
        }

        set $upstream_api api:8081;
        proxy_pass http://$upstream_api/vk/callback;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── /max/callback → api:8081/max/callback (MAX webhook) ─────────────────
    # Тело не подписано: api сверяет заголовок X-Max-Bot-Api-Secret с MAX_CALLBACK_SECRET.
    location = /max/callback {
        limit_req zone=webhook burst=50 nodelay;

        if ($request_method !~ ^POST$) {
            return 405;
        }

        set $upstream_api api:8081;
        proxy_pass http://$upstream_api/max/callback;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── /yookassa/webhook → api:8081/yookassa/webhook (ЮKassa) ──────────────
    # Тело вебхука не подписано: api сам перечитывает статус по id через API.
    location = /yookassa/webhook {
        limit_req zone=webhook burst=50 nodelay;

        if ($request_method !~ ^POST$) {
            return 405;
        }

        set $upstream_api api:8081;
        proxy_pass http://$upstream_api/yookassa/webhook;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── /robokassa/result → api:8081/robokassa/result (Робокасса ResultURL) ──
    # Тело подписано Password2 (api проверяет подпись) → доверенный источник.
    # В ответ api отдаёт "OK{InvId}". ResultURL в ЛК Робокассы = этот адрес.
    location = /robokassa/result {
        limit_req zone=webhook burst=50 nodelay;

        if ($request_method !~ ^(POST|GET)$) {
            return 405;
        }

        set $upstream_api api:8081;
        proxy_pass http://$upstream_api/robokassa/result;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── Публичные страницы графиков цены (SSR в api) ────────────────────────
    # /p/<public_id>[/slug], JSON-API, sitemap, robots. Только GET/HEAD; rate-limit
    # zone=api; динамический upstream как у /webhook (nginx жив, даже если api лёг).
    location ^~ /p/ {
        limit_req zone=api burst=20 nodelay;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $upstream_api api:8081;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location ^~ /api/ {
        limit_req zone=api burst=20 nodelay;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $upstream_api api:8081;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location = /sitemap.xml {
        limit_req zone=api burst=5 nodelay;
        set $upstream_api api:8081;
        proxy_pass http://$upstream_api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location = /robots.txt {
        set $upstream_api api:8081;
        proxy_pass http://$upstream_api/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Версионированная статика графика (css/js/uplot). Адрес меняется через ?v=
    # <git-hash> на каждом деплое → можно кэшировать «навсегда» (immutable).
    location ^~ /assets/ {
        root  /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /vendor/ {
        root  /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Self-hosted шрифты (WOFF2). Имена файлов стабильны → кэш «навсегда».
    location ^~ /fonts/ {
        root  /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        types { font/woff2 woff2; text/css css; }
    }

    # Web-манифест PWA: iOS 18+/26 поднимают standalone (полноэкранное «приложение»
    # без Safari-хрома) только если манифест отдан с ВЕРНЫМ MIME. nginx не знает
    # .webmanifest → octet-stream, а глобальный nosniff запрещает браузеру угадать
    # тип → манифест игнорируется, PWA открывается как вкладка. Форсируем тип.
    location ~* \.webmanifest$ {
        root  /usr/share/nginx/html;
        default_type application/manifest+json;
    }

    # /favicon.ico — браузеры/краулеры дёргают его напрямую; отдаём logo.png,
    # чтобы не плодить 404 (отдельного .ico нет).
    location = /favicon.ico {
        root  /usr/share/nginx/html;
        try_files /logo.png =404;
        expires 7d;
        access_log off;
    }

    # /index.html → / (301): убираем дубль главной для поисковиков.
    location = /index.html {
        return 301 https://tryberry.ru/;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        # Cache-Control + Expires для лендинга и тяжёлой статики (hero-видео/png,
        # og-cover). Директива `expires` (в отличие от add_header) НЕ сбрасывает
        # унаследованные security-заголовки. 1ч: свежесть после деплоя в пределах
        # часа, но hero-ассеты не тянутся заново каждый визит. /assets,/vendor,
        # /fonts кэшируются отдельно (immutable, год).
        expires 1h;
    }

    location ~ ^/(health|metrics|live)$ {
        return 404;
    }
}

# ── HTTPS: www → apex (301, чтобы не было дубликата www/non-www для SEO) ─────

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2 on;
    server_name www.tryberry.ru;

    ssl_certificate     /etc/letsencrypt/live/tryberry.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tryberry.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 301 https://tryberry.ru$request_uri;
}

# ── HTTPS: grafana.tryberry.ru ──────────────────────────────────────────────

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2 on;
    server_name grafana.tryberry.ru;

    ssl_certificate     /etc/letsencrypt/live/tryberry.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tryberry.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    auth_basic           "TryBerry Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd;

    limit_req zone=grafana burst=20 nodelay;

    location / {
        set $upstream_grafana grafana:3000;
        proxy_pass http://$upstream_grafana;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}
