# ────────────────────────────────────────────────────────────────────────────
# tryberry.ru — production reverse proxy
#
# DNS-резолвинг upstream'ов — динамический через Docker DNS (127.0.0.11),
# поэтому nginx стартует даже если api/grafana временно недоступны.
# ────────────────────────────────────────────────────────────────────────────

# ── Map для WebSocket upgrade (нужен Grafana live) ──────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: ACME challenge + redirect на HTTPS ────────────────────────────────

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name tryberry.ru www.tryberry.ru grafana.tryberry.ru;

    # Webroot для Let's Encrypt HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: apex (tryberry.ru / www.tryberry.ru) ─────────────────────────────

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2 on;
    server_name tryberry.ru www.tryberry.ru;

    ssl_certificate     /etc/letsencrypt/live/tryberry.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tryberry.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Docker internal DNS — для динамического резолва upstream'ов
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── /webhook → api:8081/webhook (Telegram) ──────────────────────────────
    location = /webhook {
        limit_req zone=webhook burst=50 nodelay;

        if ($request_method !~ ^POST$) {
            return 405;
        }

        # Динамический upstream через переменную: nginx резолвит при запросе,
        # а не при старте. Если api лежит — будет 502, но nginx живой.
        set $upstream_api api:8081;
        proxy_pass http://$upstream_api/webhook;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── /vk/callback → api:8081/vk/callback (VK Callback API) ───────────────
    location = /vk/callback {
        limit_req zone=webhook burst=50 nodelay;

        if ($request_method !~ ^POST$) {
            return 405;
        }

        set $upstream_api api:8081;
        proxy_pass http://$upstream_api/vk/callback;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location ~ ^/(health|metrics|live)$ {
        return 404;
    }
}

# ── HTTPS: grafana.tryberry.ru ──────────────────────────────────────────────

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2 on;
    server_name grafana.tryberry.ru;

    ssl_certificate     /etc/letsencrypt/live/tryberry.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tryberry.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    auth_basic           "TryBerry Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd;

    limit_req zone=grafana burst=20 nodelay;

    location / {
        set $upstream_grafana grafana:3000;
        proxy_pass http://$upstream_grafana;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}
