# ────────────────────────────────────────────────────────────────────────────
# tryberrybot.ru — рабочее зеркало основного сайта
#
# Зачем: на iOS Safari не открывает tryberry.ru — Apple держит домен в списке
# «обманчивых» (Google при этом чист; разбор и доказательство — в
# docs/SAFE-BROWSING-APPEAL.md). Ломается основной сценарий продукта: тап по
# графику из бота. Пока Apple не сняла запись, ссылки для пользователей ведём
# на домен без вердикта.
#
# Почему .ru, а не .online: tryberry.online подняли первым, и Яндекс.Браузер
# показал на нём плашку «Подключение не защищено. Сайту не стоит доверять»,
# хотя HTML, CSP и сертификат идентичны основному домену (сверено побайтно).
# То есть претензия к репутации домена: дешёвые новые gTLD (.online, .top,
# .xyz) имеют повышенный базовый риск в антифишинговых системах. На .ru таких
# претензий нет ни у Safari, ни у Яндекса — проверено на tryberry.ru и
# botyanit.ru. Конфиги .online оставлены, домен просто не используется.
#
# Роль домена — ЗЕРКАЛО, а не новый основной:
#   • отдаёт ту же статику из ./web и те же /p/ и /api/ с api:8081;
#   • закрыт от индексации (X-Robots-Tag: noindex) — иначе дубль сайта уронит
#     SEO основного домена (107 кликов за 28 дней, почти всё — страницы /p/);
#   • canonical у SSR-страниц строится из PUBLIC_BASE_URL (env), а НЕ из Host,
#     поэтому остаётся https://tryberry.ru — для зеркала это правильно;
#   • редиректа .ru → сюда нет и быть не должно: вердикт браузера срабатывает
#     на первом домене, до редиректа.
#
# Переключение ссылок бота — переменной USER_LINK_BASE_URL (см. docker-compose,
# сервисы bot-worker и notifier). PUBLIC_BASE_URL при этом НЕ трогаем.
#
# Порядок выкатки (сертификата ещё нет):
#   1. A/AAAA на IP сервера, ждём резолва (AAAA от reg.ru удалить — на .online
#      она час морочила голову: A вела к нам, а клиенты с IPv6 уходили на
#      парковку хостера);
#   2. кладём ТОЛЬКО этот файл, nginx -t && reload;
#   3. выпускаем сертификат (certbot --webroot);
#   4. включаем HTTPS-часть:
#        cp nginx/conf.d/tryberrybot-ssl.conf.tpl \
#           nginx/conf.d/tryberrybot-ssl.conf
#        docker exec tryberry_nginx nginx -t && \
#        docker exec tryberry_nginx nginx -s reload
#      (HTTPS-часть лежит как .tpl намеренно: nginx грузит только *.conf, а с
#       несуществующим сертификатом он не стартует.)
# ────────────────────────────────────────────────────────────────────────────

server {
    listen      80;
    listen      [::]:80;
    server_name tryberrybot.ru www.tryberrybot.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://tryberrybot.ru$request_uri;
    }
}
