user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Лог в JSON для Promtail/Loki ────────────────────────────────────────
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"host":"$host",'
        '"rt":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_rt":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout 65;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ── Rate-limit зоны ─────────────────────────────────────────────────────
    # Webhook от Telegram — лимитируем по IP. Telegram шлёт с разных адресов,
    # но если кто-то начнёт спамить — задушим. 20 r/s + burst 50.
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=20r/s;

    # Grafana — на случай если basic-auth попробуют брутфорсить
    limit_req_zone $binary_remote_addr zone=grafana:10m rate=10r/s;

    # ── TLS базовые настройки (могут быть переопределены в server-блоках) ──
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;
}
