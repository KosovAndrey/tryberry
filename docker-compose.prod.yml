# ────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml
#
# Production overlay поверх основного docker-compose.yml.
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Что делает:
#   1. Добавляет nginx (reverse proxy + TLS) и certbot (Let's Encrypt)
#   2. Добавляет node-exporter для метрик хоста (CPU, RAM, disk)
#   3. Закрывает публичные ports у служебных сервисов
#   4. Включает webhook-режим у API, отключает анонимный доступ к Grafana
# ────────────────────────────────────────────────────────────────────────────

services:
  token-miner:
    restart: unless-stopped
  token-miner-reseller:
    restart: unless-stopped
  wb-search-miner:
    restart: unless-stopped
  ali-miner:
    restart: unless-stopped
  search-worker:
    restart: unless-stopped
  reseller-worker:
    restart: unless-stopped
  bot-worker:
    restart: unless-stopped

# ── Reverse proxy + TLS ────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: tryberry_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - grafana
    # Reload каждые 6 часов — подхватить обновлённые сертификаты certbot
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done
      & nginx -g 'daemon off;'"
    labels:
      logging: "promtail"
      service: "nginx"

  # ── Let's Encrypt автоматическое обновление ─────────────────────────────
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: tryberry_certbot
    restart: unless-stopped
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

  # ── Метрики хоста ──────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: pt_node_exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    pid: host
    # Порт НЕ публикуем — Prometheus сходит через docker network

  # ── Базовые сервисы: закрываем публичные порты ──────────────────────────
  api:
    restart: unless-stopped
    ports: !reset []
    environment:
      WEBHOOK_ENABLED: "false"
      TELEGRAM_WEBHOOK_URL: "https://tryberry.ru/webhook"

  scraper:
    restart: unless-stopped
    ports: !reset []
    # Скрейпер — узкое место (I/O-bound, маркетплейсы отвечают сотни мс). Планировщик
    # кладёт scrape-tasks (10 партиций) быстрее, чем одна реплика их дренирует → лаг
    # растёт. 3 реплики проверены как оптимум (нагрузочный тест 5k синтетиков). Держим
    # в оверрлее, потому что число реплик — runtime-флаг: без этого любой `up -d` без
    # `--scale scraper=3` тихо откатывал в 1 реплику. `--scale` остаётся для ручного
    # разгона под пик. Реплики безопасны: consumer-group делит партиции, partition.Manager
    # идемпотентен под advisory-lock.
    deploy:
      replicas: 3

  notifier:
    restart: unless-stopped
    ports: !reset []

  scheduler:
    restart: unless-stopped

  grafana:
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://grafana.tryberry.ru"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"

  prometheus:
    ports: !reset []

  alertmanager:
    ports: !reset []

  jaeger:
    ports: !reset []

  loki:
    ports: !reset []

  promtail:
    ports: !reset []

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  kafka:
    ports: !reset []

  zookeeper:
    ports: !reset []

  # ── Бэкап Postgres: локальные дампы с ротацией ──────────────────────────
  # Делает pg_dump по расписанию, сжимает gzip, сам удаляет старые.
  # Дампы складываются в ./backups на диске VM.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: pt_postgres_backup
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: tryberrybot
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_EXTRA_OPTS: "-Z6 --blobs"   # gzip уровень 6
      SCHEDULE: "@daily"                   # раз в сутки в полночь
      BACKUP_KEEP_DAYS: 7                  # 7 дневных
      BACKUP_KEEP_WEEKS: 4                 # 4 недельных
      BACKUP_KEEP_MONTHS: 6                # 6 месячных
      HEALTHCHECK_PORT: 8080
      TZ: "Europe/Moscow"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Синхронизация бэкапов в S3 (Selectel Object Storage) ────────────────
  # Каждые 6 часов заливает ./backups в S3-бакет. Зеркалит локальную папку,
  # то есть в S3 та же ротация что и локально (7d + 4w + 6m).
  # Эндпоинт/регион — через .env (дефолты Selectel; для другого провайдера
  # достаточно переопределить S3_ENDPOINT/S3_REGION).
  backup-s3-sync:
    image: rclone/rclone:1.68
    container_name: pt_backup_s3sync
    restart: unless-stopped
    volumes:
      - ./backups:/backups:ro
    environment:
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: Other
      RCLONE_CONFIG_S3_ENV_AUTH: "false"
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set in .env}"
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set in .env}"
      RCLONE_CONFIG_S3_ENDPOINT: "${S3_ENDPOINT:-https://s3.storage.selcloud.ru}"
      RCLONE_CONFIG_S3_REGION: "${S3_REGION:-ru-1}"
    entrypoint: /bin/sh -c "trap exit TERM;
      while :; do
      rclone sync /backups s3:${S3_BUCKET:-tryberry-backups} --copy-links --log-level INFO;
      sleep 6h & wait $${!}; done"
    depends_on:
      - postgres-backup

volumes:
  nginx_logs:
